<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collect One Balloon Form</title>
    <script>
      // When embedded inside a sandboxed KML balloon iframe without `allow-same-origin`
      // (such as Google Earth Web), Chromium throws a SecurityError merely reading the
      // `window.caches` getter, which aborts Compose Multiplatform's `supportsCacheApi()`
      // check before font and string resources can load.
      try {
        void window.caches;
      } catch (e) {
        try {
          Object.defineProperty(window, 'caches', {
            value: undefined,
            configurable: true,
          });
        } catch (_) {}
      }
    </script>
    <link rel="preload" href="./composeResources/org.openforis.collectone.v2.core.forms.ui.resources/font/google_sans_flex_regular.ttf" as="fetch" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="./composeResources/org.openforis.collectone.v2.core.forms.ui.resources/font/google_sans_flex_medium.ttf" as="fetch" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="./composeResources/org.openforis.collectone.v2.core.forms.ui.resources/font/google_sans_flex_semibold.ttf" as="fetch" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="./composeResources/org.openforis.collectone.v2.core.forms.ui.resources/font/google_sans_flex_bold.ttf" as="fetch" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="./composeResources/org.openforis.collectone.v2.core.forms.ui.resources/font/google_sans_flex_extrabold.ttf" as="fetch" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="./composeResources/org.openforis.collectone.v2.core.forms.ui.resources/font/google_sans_code.ttf" as="fetch" type="font/ttf" crossorigin="anonymous" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #FFFFFF;
            font-family: 'Google Sans Flex', sans-serif;
        }
        #ComposeTarget {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="ComposeTarget"></div>
    <script src="./user-data-service-config.js"></script>
    <script>
      // Sandboxed KML balloon bridge (safe under opaque `Origin: null` — never accesses
      // localStorage, sessionStorage, IndexedDB, cookies, or history.pushState).
      (function () {
        const listeners = new Set();
        const localDrafts = new Map();
        let latestInitJson = null;

        function toUrlSafeBase64(bytes) {
          let binary = '';
          for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function fromUrlSafeBase64(str) {
          const normalized = str.replace(/-/g, '+').replace(/_/g, '/');
          const padded = normalized + '==='.slice((normalized.length + 3) % 4);
          const binary = atob(padded);
          const out = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            out[i] = binary.charCodeAt(i);
          }
          return out;
        }

        window.addEventListener('message', function (event) {
          try {
            const data = event && event.data;
            if (!data || typeof data !== 'object') return;
            if (data.type === 'collectone:balloon-init' && data.params && typeof data.params === 'object') {
              const serialized = JSON.stringify(data.params);
              latestInitJson = serialized;
              listeners.forEach(function (fn) {
                try { fn(serialized); } catch (e) {}
              });
            }
          } catch (e) {}
        });

        window.CollectOneBalloonBridge = {
          subscribe: function (callback) {
            listeners.add(callback);
            if (latestInitJson) {
              try { callback(latestInitJson); } catch (e) {}
            }
            try {
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'collectone:balloon-ready' }, '*');
              }
            } catch (e) {}
            return callback;
          },
          unsubscribe: function (handle) {
            listeners.delete(handle);
          },
          authPageUrl: function () {
            try {
              const href = window.location.href || '';
              if (window.location.pathname && window.location.pathname.indexOf('/balloon/') !== -1) {
                return new URL('../balloon-auth.html', href).href;
              }
              return new URL('./balloon-auth.html', href).href;
            } catch (e) {
              return '/balloon-auth.html';
            }
          },
          openExternalUrl: function (url) {
            if (!url || typeof url !== 'string') return;
            try {
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'collectone:open-external-url', url: url }, '*');
                return;
              }
            } catch (e) {}
            try {
              if (typeof window.open === 'function') {
                window.open(url, '_blank', 'noopener,noreferrer');
              }
            } catch (e) {}
          },
          claimAuthSession: function (serviceUrl, sessionId, codeVerifier, callback) {
            try {
              const endpoint = String(serviceUrl || '').replace(/\/+$/, '') + '/balloon/auth/claim';
              fetch(endpoint, {
                method: 'POST',
                mode: 'cors',
                credentials: 'omit',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                },
                body: JSON.stringify({
                  sessionId: sessionId,
                  codeVerifier: codeVerifier,
                }),
              })
                .then(function (resp) {
                  return resp.text().then(function (txt) {
                    callback(resp.status, txt || '', '');
                  });
                })
                .catch(function (err) {
                  callback(0, '', err && err.message ? err.message : String(err));
                });
            } catch (err) {
              callback(0, '', err && err.message ? err.message : String(err));
            }
          },
          fetchEntityState: function (serviceUrl, surveyId, entityId, callback) {
            try {
              const cleanService = String(serviceUrl || '').replace(/\/+$/, '');
              const draftKey = String(surveyId || '') + '::' + String(entityId || '');
              if (!cleanService || !surveyId || !entityId) {
                const local = localDrafts.get(draftKey);
                callback(
                  200,
                  JSON.stringify({
                    surveyId: surveyId || '',
                    entityId: entityId || '',
                    status: '',
                    markerSymbol: '',
                    markerColor: '',
                    entityLabel: '',
                    draftFormId: local ? local.formId : '',
                    draftRecordBase64: local ? local.recordBase64 : '',
                  }),
                  ''
                );
                return;
              }
              const endpoint =
                cleanService +
                '/balloon/state/' +
                encodeURIComponent(surveyId) +
                '/' +
                encodeURIComponent(entityId);
              fetch(endpoint, {
                method: 'GET',
                mode: 'cors',
                credentials: 'omit',
                headers: {
                  'Accept': 'application/json',
                },
              })
                .then(function (resp) {
                  return resp.text().then(function (txt) {
                    callback(resp.status, txt || '', '');
                  });
                })
                .catch(function (err) {
                  callback(0, '', err && err.message ? err.message : String(err));
                });
            } catch (err) {
              callback(0, '', err && err.message ? err.message : String(err));
            }
          },
          saveDraftState: function (serviceUrl, surveyId, entityId, formId, recordBase64, callback) {
            try {
              const cleanService = String(serviceUrl || '').replace(/\/+$/, '');
              const draftKey = String(surveyId || '') + '::' + String(entityId || '');
              if (!recordBase64) {
                localDrafts.delete(draftKey);
              } else {
                localDrafts.set(draftKey, { formId: formId || '', recordBase64: recordBase64 });
              }
              if (!cleanService || !surveyId || !entityId) {
                if (typeof callback === 'function') callback(200);
                return;
              }
              const endpoint =
                cleanService +
                '/balloon/state/' +
                encodeURIComponent(surveyId) +
                '/' +
                encodeURIComponent(entityId);
              fetch(endpoint, {
                method: 'POST',
                mode: 'cors',
                credentials: 'omit',
                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                },
                body: JSON.stringify({
                  formId: formId || '',
                  recordBase64: recordBase64 || '',
                }),
              })
                .then(function (resp) {
                  if (typeof callback === 'function') callback(resp.status);
                })
                .catch(function () {
                  if (typeof callback === 'function') callback(0);
                });
            } catch (err) {
              if (typeof callback === 'function') callback(0);
            }
          },
          copyText: function (text) {
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(function () {});
                return true;
              }
            } catch (e) {}
            try {
              const area = document.createElement('textarea');
              area.value = text;
              area.style.position = 'fixed';
              area.style.opacity = '0';
              document.body.appendChild(area);
              area.select();
              const ok = document.execCommand('copy');
              document.body.removeChild(area);
              return Boolean(ok);
            } catch (e) {
              return false;
            }
          },
          postGrpcWeb: function (url, authToken, devHeadersJson, framedBase64, callback) {
            try {
              const headers = {
                'Content-Type': 'application/grpc-web+proto',
                'Accept': 'application/grpc-web+proto',
                'X-Grpc-Web': '1',
              };
              if (authToken) {
                headers['Authorization'] = 'Bearer ' + authToken;
              }
              if (devHeadersJson) {
                try {
                  const parsed = JSON.parse(devHeadersJson);
                  if (parsed && typeof parsed === 'object') {
                    Object.keys(parsed).forEach(function (k) {
                      if (parsed[k]) headers[k] = String(parsed[k]);
                    });
                  }
                } catch (e) {}
              }
              const body = fromUrlSafeBase64(framedBase64);
              fetch(url, {
                method: 'POST',
                mode: 'cors',
                credentials: 'omit',
                headers: headers,
                body: body,
              })
                .then(function (resp) {
                  const grpcStatus = resp.headers.get('grpc-status') || '';
                  const grpcMessage = resp.headers.get('grpc-message') || '';
                  if (!resp.ok && !grpcStatus) {
                    callback('', String(resp.status), resp.statusText || 'HTTP error', 'HTTP ' + resp.status);
                    return null;
                  }
                  return resp.arrayBuffer().then(function (buf) {
                    callback(toUrlSafeBase64(new Uint8Array(buf)), grpcStatus, grpcMessage, '');
                  });
                })
                .catch(function (err) {
                  callback('', '', '', err && err.message ? err.message : String(err));
                });
            } catch (err) {
              callback('', '', '', err && err.message ? err.message : String(err));
            }
          },
        };
      })();
    </script>
    <script src="./balloonFormApp.js"></script>
</body>
</html>
