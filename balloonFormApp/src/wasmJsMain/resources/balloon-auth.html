<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collect One — Google Earth Sign-In</title>
  <script>
    // Redirect standalone `/balloon/balloon-auth.html` requests to the root `/balloon-auth.html`
    // page when hosted alongside the Web Console so Firebase OAuth popups run without COEP.
    if (window.location.pathname.indexOf('/balloon/') !== -1) {
      window.location.replace(
        window.location.origin + '/balloon-auth.html' + window.location.search + window.location.hash
      );
    }
  </script>
</head>
<body></body>
</html>
