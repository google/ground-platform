name: Check

on:
  pull_request:
  push:
    branches: [c1, wip/baobab]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Check Kotlin formatting (ktfmt)
        run: bash scripts/ktfmt.sh --check

      - name: Check proto formatting (buf)
        if: ${{ !cancelled() && hashFiles('shared/protos/**/*.proto') != '' }}
        run: bash scripts/buf-format.sh --check

      - name: Check license headers
        if: ${{ !cancelled() }}
        run: bash scripts/license-check.sh --check

  # The server tests that need the Spanner emulator. Its unit tests (in-memory fake store) run with
  # the coverage report in kmp-tests.
  server:
    name: server Spanner tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # The Gradle build downloads its own JDK 21 toolchain; this JDK only runs Gradle. Passing
      # `-Pcollectone.serverOnly=true` configures only `:shared:core` and `:server`, without an
      # Android SDK.
      - name: Set up JDK
        if: ${{ hashFiles('server/build.gradle.kts') != '' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache the Spanner emulator
        if: ${{ hashFiles('server/build.gradle.kts') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/collect-one/spanner-emulator
          key: spanner-emulator-${{ runner.os }}-${{ hashFiles('scripts/spanner-emulator.sh') }}

      # Starts its own Spanner emulator from scripts/spanner-emulator.sh.
      - name: Run Spanner tests
        if: ${{ hashFiles('server/build.gradle.kts') != '' }}
        run: ./gradlew -Pcollectone.serverOnly=true :server:spannerTest --console=plain

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-test-reports
          path: server/build/reports/tests

  # JVM unit tests (including the golden-screenshot tests) of every Kotlin Multiplatform module and
  # the server's unit tests, with their merged coverage report (Kover), and detekt on the modules
  # that apply it (shared/core, the shared/app modules, shared/web, server). The Playwright goldens
  # run in goldens.yml.
  kmp-tests:
    name: jvm tests, coverage, and detekt
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # The Gradle build downloads its own JDK 21 toolchain; this JDK only runs Gradle. The runner
      # image provides the Android SDK (ANDROID_HOME) that the Android targets need.
      - name: Set up JDK
        if: ${{ hashFiles('shared/**/build.gradle.kts', 'server/build.gradle.kts') != '' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The Kover reports (of the JVM tests only, the jvmTests variant) reuse the instrumented test
      # runs; :koverVerifyJvmTests fails when the merged line coverage drops below the minimum in the
      # root build.gradle.kts (checked once the full module tree is present).
      - name: Run JVM unit tests, coverage, and detekt
        if: ${{ hashFiles('shared/**/build.gradle.kts', 'server/build.gradle.kts') != '' }}
        run: |
          TASKS="jvmTest detekt :koverXmlReportJvmTests :koverHtmlReportJvmTests"
          if [ -f server/build.gradle.kts ]; then
            TASKS="$TASKS :server:test"
          fi
          if [ -f shared/web/build.gradle.kts ] && [ -f server/build.gradle.kts ]; then
            TASKS="$TASKS :koverVerifyJvmTests"
          fi
          ./gradlew $TASKS --continue --console=plain

      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('build/reports/kover/reportJvmTests.xml') != '' }}
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET

          report = ET.parse("build/reports/kover/reportJvmTests.xml").getroot()
          rows = []
          for counter in report.findall("counter"):
              covered, missed = int(counter.get("covered")), int(counter.get("missed"))
              total = covered + missed
              percent = 100 * covered / total if total else 100
              rows.append(f"| {counter.get('type').title()} | {percent:.2f}% | {covered} / {total} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Coverage (all modules)\n\n| Counter | Covered | Count |\n|---|---|---|\n")
              summary.write("\n".join(rows) + "\n")

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/reports/kover/htmlJvmTests
          if-no-files-found: warn

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-test-reports
          # build/reports/goldens holds the rendered screenshots of golden tests that failed.
          path: |
            **/build/reports/tests
            **/build/reports/goldens
