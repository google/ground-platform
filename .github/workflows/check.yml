name: Check

on:
  pull_request:
  push:
    branches: [master]

env:
  NX_CACHE_DIRECTORY: .nx/cache

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      lib: ${{ steps.filter.outputs.lib }}
      proto: ${{ steps.filter.outputs.proto }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
              - 'package*.json'
              - 'nx.json'
              - '.github/workflows/check.yml'
              - '.github/actions/setup/**'
            lib:
              - 'lib/**'
              - 'package*.json'
              - 'nx.json'
              - '.github/workflows/check.yml'
              - '.github/actions/setup/**'
            proto:
              - 'proto/**'
              - 'package*.json'
              - 'nx.json'
              - '.github/workflows/check.yml'
              - '.github/actions/setup/**'
            web:
              - 'web/**'
              - 'package*.json'
              - 'nx.json'
              - '.github/workflows/check.yml'
              - '.github/actions/setup/**'

  functions:
    needs: changes
    if: ${{ needs.changes.outputs.functions == 'true' }}
    name: functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cache-key-suffix: functions

      - name: Check formatting
        run: pnpm exec nx run functions:format:check
        continue-on-error: true

      - name: Lint
        run: pnpm exec nx lint functions

      - name: Build
        run: pnpm exec nx build functions

      - name: Test
        run: pnpm exec nx test functions

  lib:
    needs: changes
    if: ${{ needs.changes.outputs.lib == 'true' }}
    name: lib
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cache-key-suffix: lib

      - name: Check formatting
        run: pnpm exec nx run lib:format:check
        continue-on-error: true

      - name: Lint
        run: pnpm exec nx lint lib

      - name: Build
        run: pnpm exec nx build lib

      - name: Test
        run: pnpm exec nx test lib

  proto:
    needs: changes
    if: ${{ needs.changes.outputs.proto == 'true' }}
    name: proto
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cache-key-suffix: proto

      - name: Build
        run: pnpm exec nx build proto

      - name: Lint
        run: pnpm exec nx lint proto

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cache-key-suffix: web

      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Configure Chrome Environment
        shell: bash
        run: |
          echo "CHROME_BIN=${STEPS_SETUP_CHROME_OUTPUTS_CHROME_PATH}" >> $GITHUB_ENV
          echo "CHROME_PATH=${STEPS_SETUP_CHROME_OUTPUTS_CHROME_PATH}" >> $GITHUB_ENV
        env:
          STEPS_SETUP_CHROME_OUTPUTS_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Check formatting
        run: pnpm exec nx run web:format:check
        continue-on-error: true

      - name: Lint
        run: pnpm exec nx lint web
        continue-on-error: true

      - name: Build
        run: pnpm exec nx build web

      - name: Test
        run: pnpm exec nx test web

      - name: Update test coverage report
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
