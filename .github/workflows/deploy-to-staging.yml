name: Deploy to staging Firebase
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    if: github.repository_owner == 'google'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Build project and local deps
        run: pnpm exec nx build --configuration=staging

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROUND_DEV_SIG }}
          channelId: live
          projectId: ground-dev-sig
