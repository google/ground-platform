syntax = "proto3";

package groundplatform.v2.library;

import "shared/protos/library/concept.proto";
import "shared/protos/library/purpose_pack.proto";
import "shared/protos/library/template.proto";

// A set of library entries exchanged as one unit: the top-level message of each
// global seed file (`shared/assets/library/<vocabulary>.textproto`), and of
// library imports and exports.
message LibraryBundle {
  repeated ConceptDef concepts = 1;
  repeated FormTemplateDef form_templates = 2;
  repeated PurposePackDef purpose_packs = 3;
  repeated ExportProfileDef export_profiles = 4;
}
