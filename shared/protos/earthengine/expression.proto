syntax = "proto3";

package google.earthengine.v1main;

import "google/protobuf/struct.proto";

message ValueNode {
  oneof kind {
    google.protobuf.Value constant_value = 1;
    int64 integer_value = 2;
    bytes bytes_value = 3;
    ArrayValue array_value = 4;
    DictionaryValue dictionary_value = 5;
    FunctionDefinition function_definition_value = 6;
    FunctionInvocation function_invocation_value = 7;
    string argument_reference = 8;
    string value_reference = 9;
  }
}

message ArrayValue {
  repeated ValueNode values = 1;
}

message DictionaryValue {
  map<string, ValueNode> values = 1;
}

message FunctionDefinition {
  repeated string argument_names = 1;
  string body = 2;
}

message FunctionInvocation {
  oneof function {
    string function_name = 1;
    string function_reference = 2;
  }
  map<string, ValueNode> arguments = 3;
}

message Expression {
  map<string, ValueNode> values = 1;
  string result = 2;
}
