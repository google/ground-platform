syntax = "proto3";

package groundplatform.v2.survey;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "shared/protos/forms/form_def.proto";
import "shared/protos/forms/types.proto";
import "shared/protos/survey/acl.proto";
import "shared/protos/survey/survey_def.proto";

// Core gRPC service for discovering, reading, and atomically mutating survey
// definitions, sub-resources (forms, entity datasets, map layers), collaborator
// ACLs, and survey access policies.
//
// `ListSurveyOverviews` syncs lightweight `SurveyOverview` records for the
// survey list (`docs/technical/sync-engine.md`), while `GetSurvey` retrieves
// the full `SurveyDef` for surveys the user opens or has downloaded for
// offline use.
service SurveyService {
  // Lists the overviews of surveys the caller can access as the owner,
  // through an ACL entry, or through `ORGANIZATION` sharing. Surveys the
  // caller can open only through `ANYONE_WITH_LINK` or `PUBLIC` sharing aren't
  // listed; clients reach them by ID (`BatchGetSurveyOverviews`, `GetSurvey`)
  // or find public ones with `SearchPublicSurveys`. Whether `sync_token` is
  // set selects the mode (`docs/technical/sync-engine.md`, "List RPCs: Query
  // and Delta Modes"):
  //   - Query mode (`sync_token` unset): every overview in scope except
  //     trashed and deleted surveys, paged with `page_size` / `page_token`.
  //     Every page
  //     reads the snapshot pinned in `page_token`; the last page carries
  //     `next_sync_token` for the scope at that snapshot.
  //   - Delta mode (`sync_token` set): every overview in scope changed after
  //     the token, in commit order, including tombstones (`state == DELETED`)
  //     for surveys that were trashed or purged and surveys the caller lost
  //     access to. The last page carries
  //     `next_sync_token`. `next_page_token` is itself a valid `sync_token`,
  //     so a client can store it after applying a page.
  // Delivery is at least once: an overview can appear in a query page and in
  // the delta that follows. Fails with `INVALID_ARGUMENT` when `sync_token` is
  // malformed or was issued for a different scope (`organization_id`), and
  // with `FAILED_PRECONDITION` when the server can no longer serve changes
  // from `sync_token`; the client then discards it and runs a full sync.
  rpc ListSurveyOverviews(ListSurveyOverviewsRequest) returns (ListSurveyOverviewsResponse);

  // Retrieves the complete `SurveyDef` (including all forms, entity dataset
  // schemas, map configs, and translations) for a survey the user has
  // downloaded for offline mobile sync or opened for web editing.
  rpc GetSurvey(GetSurveyRequest) returns (GetSurveyResponse);

  // Retrieves the Access Control List (ACL) and access rules (`SharingPolicy`
  // and `PeerDataVisibility`) for a survey.
  rpc GetSurveyAcl(GetSurveyAclRequest) returns (GetSurveyAclResponse);

  // Atomically and idempotently applies an ordered batch of mutations to
  // initialize or update survey fields/sub-resources, configure ACLs/access
  // rules, save or discard the working copy, or move a survey to Trash and
  // restore it. Surveys are never hard-deleted by clients; trashed surveys are
  // purged by the server after the retention period.
  rpc MutateSurvey(MutateSurveyRequest) returns (MutateSurveyResponse);

  // Redeems an email invite token from an `AclEntry` the organizer created,
  // binding the caller's authenticated `user_id` to it. Only organizers add or
  // remove ACL entries; link and public sharing never create them.
  rpc AcceptSurveyInvite(AcceptSurveyInviteRequest) returns (AcceptSurveyInviteResponse);

  // Returns the caller's current view of specific surveys, typically the ones
  // downloaded on a device, so clients learn about new saved revisions, Trash,
  // purges, and lost access without the survey list being open. Stateless:
  // one result per requested ID, in request order.
  rpc BatchGetSurveyOverviews(BatchGetSurveyOverviewsRequest) returns (BatchGetSurveyOverviewsResponse);

  // Searches the public directory of surveys with `sharing_policy = PUBLIC`
  // by keyword (title and description). Trashed and deleted surveys are
  // excluded.
  rpc SearchPublicSurveys(SearchPublicSurveysRequest) returns (SearchPublicSurveysResponse);
}

// Request to list the overviews of surveys accessible to the caller.
message ListSurveyOverviewsRequest {
  // Scope: optional organization ID. Empty lists surveys across all of the
  // caller's organizations and personal surveys.
  string organization_id = 1;

  // Maximum number of overviews to return. The server picks a default when
  // unset and caps large values.
  int32 page_size = 2;

  // `next_page_token` from the previous page of the same call sequence.
  string page_token = 3;

  // Opaque `next_sync_token` from an earlier call for the same scope. Selects
  // delta mode.
  string sync_token = 4;
}

// A page of survey overviews.
message ListSurveyOverviewsResponse {
  repeated SurveyOverview overviews = 1;

  // Token for the next page; empty on the last page.
  string next_page_token = 2;

  // Opaque token for the next delta call, set on the last page only.
  string next_sync_token = 3;
}

// Request to retrieve a single survey definition.
message GetSurveyRequest {
  // Unique identifier of the survey (`SurveyDef.survey_id`).
  string survey_id = 1;

  // Reference to the organizer's working copy.
  message WorkingCopy {}

  // Which revision of the survey to fetch. When unset, returns the latest saved
  // revision (the one collectors use).
  oneof revision {
    // A specific immutable saved revision (`SurveyDef.version`).
    string saved_version = 2;

    // Returns the organizer's working copy, including edits that
    // haven't been saved yet. `GetSurveyResponse.survey` is unset if there is
    // no working copy; clients then start editing from the latest saved
    // revision.
    WorkingCopy working_copy = 3;
  }
}

// Response containing the requested survey revision and caller's effective
// access.
message GetSurveyResponse {
  // The requested revision of the survey.
  SurveyDef survey = 1;

  // Access rules and ACL for the survey, if authorized to view.
  SurveyAcl acl = 2;

  reserved 3;
  reserved "working_copy";
}

// Request to retrieve the ACL and access rules for a survey.
message GetSurveyAclRequest {
  // Unique identifier of the survey (`SurveyDef.survey_id`).
  string survey_id = 1;
}

// Response containing the survey ACL and access rules.
message GetSurveyAclResponse {
  // Current ACL and sharing/visibility rules for the survey.
  SurveyAcl acl = 1;
}

// Repeated string list wrapper for path-addressed list patches (e.g.,
// `"supported_languages"`, `"purpose_ids"`, `"program_ids"`, `"forms_order"`).
message StringListValue {
  repeated string values = 1;
}

// Key-value mutation entry for setting, updating, or deleting a field or
// keyed sub-resource within a `SurveyDef`.
message SurveyFieldPatch {
  // Target field name or collection item path within `SurveyDef` (e.g.,
  // `"title"`, `"description"`, `"organization_id"`, `"owner_id"`, `"state"`,
  // `"closed_at"`, `"default_language"`, `"supported_languages"`,
  // `"purpose_ids"`, `"program_ids"`, `"outcome"`, `"forms/<form_id>"`,
  // `"forms/<form_id>/controls/<control_id>"`,
  // `"entity_datasets/<dataset_id>"`,
  // `"entity_datasets/<dataset_id>/properties/<prop_name>"`,
  // `"map_config"`, `"map_config/survey_area"`,
  // `"map_config/layers/<layer_id>"`, `"form_launch_configs/<form_id>"`,
  // `"form_concept_links/<form_id>"`, `"translations"`).
  string key = 1;

  // New value to assign, or `null_value` to delete/clear the target key.
  oneof value {
    // Deletes the collection item or clears the field identified by `key`
    // (idempotent no-op if already unset/absent).
    google.protobuf.NullValue null_value = 2;

    // Scalar string value.
    string string_value = 3;

    // Lifecycle state transition (for `"state"`, including `DELETED` for
    // soft-delete).
    SurveyState state_value = 4;

    // Full map configuration replacement (for `"map_config"`).
    MapConfig map_config_value = 5;

    // Map layer definition to add or update (for
    // `"map_config/layers/<layer_id>"`).
    LayerDef layer_value = 6;

    // Form definition to add or update (for `"forms/<form_id>"`).
    groundplatform.v2.forms.FormDef form_value = 7;

    // Form launch configuration to add or update (for
    // `"form_launch_configs/<form_id>"`).
    FormLaunchConfig form_launch_config_value = 8;

    // Entity dataset schema to add or update (for
    // `"entity_datasets/<dataset_id>"`).
    EntityDatasetDef entity_dataset_value = 9;

    // Translation catalog to set or update (for `"translations"`).
    groundplatform.v2.forms.TranslationCatalog translations_value = 10;

    // Boolean value (e.g., `"is_downloaded"`).
    bool bool_value = 11;

    // Timestamp value (e.g., `"closed_at"`).
    google.protobuf.Timestamp timestamp_value = 12;

    // String list value (e.g., `"supported_languages"`, `"purpose_ids"`,
    // `"program_ids"`, `"forms_order"`, `"entity_datasets_order"`).
    StringListValue string_list_value = 13;

    // Survey outcome value (for `"outcome"`).
    SurveyOutcome outcome_value = 14;

    // Survey area boundary value (for `"map_config/survey_area"`).
    SurveyArea survey_area_value = 15;

    // Form concept links value (for `"form_concept_links/<form_id>"`).
    FormConceptLinks form_concept_links_value = 16;

    // Single entity dataset property definition (for
    // `"entity_datasets/<dataset_id>/properties/<prop_name>"`).
    EntityPropertyDefinition entity_property_value = 17;

    // Sampling design generator for a dataset (for
    // `"entity_datasets/<dataset_id>/sampling"`).
    SamplingDesign sampling_design_value = 18;
  }
}

// Key-value mutation entry for granting, updating, or revoking a user's role on
// a survey.
message AclRolePatch {
  // Target user identifier (`AclEntry.user_id` or `AclEntry.email`).
  string user_id = 1;

  // Role assignment, full `AclEntry`, or `null_value` to revoke access.
  oneof value {
    // Revokes the user's explicit ACL entry on this survey (idempotent no-op
    // if already absent).
    google.protobuf.NullValue null_value = 2;

    // Grants or updates the user's collaborator role (`VIEWER`,
    // `DATA_COLLECTOR`, or `SURVEY_ORGANIZER`).
    Role role = 3;

    // Upserts a complete `AclEntry` including email, invite token, and cached
    // profile.
    AclEntry entry_value = 4;
  }
}

// Mutation updating survey-wide access rules (`SharingPolicy`,
// `PeerDataVisibility`, collector consent, and CARE sovereignty).
message AccessRulesPatch {
  // If non-unspecified, updates the survey's general sharing policy
  // (`RESTRICTED`, `ORGANIZATION`, `ANYONE_WITH_LINK`, `PUBLIC`).
  SharingPolicy sharing_policy = 1;

  // If non-unspecified, updates peer data visibility for field collectors
  // (`ALL`, `OWN_ONLY`).
  PeerDataVisibility peer_data_visibility = 2;

  // Optional update to `collector_consent_required`.
  optional bool collector_consent_required = 3;

  // Optional update to `collector_consent_text`.
  optional string collector_consent_text = 4;

  // Optional update to `care_sovereignty_applied`.
  optional bool care_sovereignty_applied = 5;

  // Optional update to primary owner user ID (`SurveyAcl.owner_id`).
  optional string owner_id = 6;

  // If non-unspecified, updates `SurveyAcl.default_role`: what people who
  // have access through `sharing_policy` can do (`VIEWER` or
  // `DATA_COLLECTOR`). `SURVEY_ORGANIZER` is rejected with
  // `INVALID_ARGUMENT`; organizers must be named on the ACL.
  Role default_role = 7;
}

// A single idempotent mutation step within a batched `MutateSurveyRequest`.
message SurveyMutation {
  oneof operation {
    // Initializes (if the survey does not yet exist) or updates a specific
    // field or keyed sub-resource within `SurveyDef`.
    SurveyFieldPatch update_field = 1;

    // Grants, updates, or revokes (`null_value`) a single user's role on the
    // survey ACL.
    AclRolePatch update_acl_role = 2;

    // Updates the survey's `SharingPolicy`, `PeerDataVisibility`, and consent
    // rules.
    AccessRulesPatch update_access_rules = 3;

    // Moves the survey to Trash (sets `SurveyDef.trash_time`). Trashed surveys
    // disappear from every user's survey list and stop syncing; they can be
    // restored with `restore_survey` until they are purged automatically
    // after the retention period (30 days). Doesn't change `SurveyDef.state`.
    bool trash_survey = 13;

    // Restores a trashed survey (clears `SurveyDef.trash_time`). A no-op when
    // the survey isn't in Trash.
    bool restore_survey = 14;

    // Replaces the entire `SurveyDef` snapshot (or the working copy when
    // `MutateSurveyRequest.working_copy` is true).
    SurveyDef upsert_survey = 5;

    // Replaces the entire `SurveyAcl` snapshot.
    SurveyAcl upsert_acl = 6;

    // Saves the working copy as the new saved revision and increments
    // `saved_revision_number`. Doesn't change `SurveyDef.state`.
    bool save_working_copy = 7;

    // Discards unsaved edits, resetting the working copy to the latest saved
    // revision.
    bool discard_working_copy = 8;
  }

  // Client-generated UUID from the offline outbox, identifying the mutation in
  // client logs. Replays are detected by `client_seq`, not by this ID.
  string mutation_id = 9;

  // Stable identifier of the client install that recorded the mutation.
  string client_id = 10;

  // Monotonically increasing sequence number of the mutation within
  // `client_id` (`GetAppliedMutations`, scope `"surveys/<survey_id>"`).
  int64 client_seq = 11;

  // Client-side timestamp when the mutation was recorded.
  google.protobuf.Timestamp client_timestamp = 12;

  // Former hard delete. Surveys are moved to Trash (`trash_survey`) instead.
  reserved 4;
  reserved "delete_survey";
}

// Request to atomically and idempotently apply an ordered sequence of mutations
// to a survey.
message MutateSurveyRequest {
  // Client-defined survey UUID (`SurveyDef.survey_id`, RFC 4122 v4).
  string survey_id = 1;

  // Expected base version for optimistic concurrency control on existing
  // surveys (optional). Field patches are applied last-writer-wins regardless
  // of `base_version`; only whole-snapshot replacements (`upsert_survey`,
  // `upsert_acl`) fail with `FAILED_PRECONDITION` when it is set and stale.
  string base_version = 2;

  // Ordered sequence of idempotent survey field, ACL, access rule, trash, or
  // working copy mutations to execute atomically.
  repeated SurveyMutation mutations = 3;

  // When true, applies `mutations` to the organizer's working copy instead of
  // the saved revision.
  bool working_copy = 4;
}

// Response returning the resulting survey state after applying all mutations.
message MutateSurveyResponse {
  // Target survey identifier.
  string survey_id = 1;

  // The mutated revision (the working copy when
  // `MutateSurveyRequest.working_copy` is true, otherwise the saved revision),
  // with incremented `version` and `commit_timestamp`.
  SurveyDef survey = 2;

  // Resulting ACL and access rules for the survey.
  SurveyAcl acl = 3;

  reserved 4;
  reserved "working_copy";

  // Authoritative server commit timestamp assigned to this mutation batch.
  google.protobuf.Timestamp commit_timestamp = 5;
}

message AcceptSurveyInviteRequest {
  string survey_id = 1;
  string invite_token = 2;
  string user_id = 3;
  string email = 4;
  CachedProfile profile = 5;
}

message AcceptSurveyInviteResponse {
  SurveyDef survey = 1;
  SurveyAcl acl = 2;
  google.protobuf.Timestamp commit_timestamp = 3;
}

// Request for the caller's current view of specific surveys.
message BatchGetSurveyOverviewsRequest {
  // Survey IDs to look up (`SurveyDef.survey_id`). The server caps the number
  // of IDs per request and fails with `INVALID_ARGUMENT` above it.
  repeated string survey_ids = 1;
}

// The caller's view of one requested survey.
message SurveyOverviewResult {
  // The requested survey ID.
  string survey_id = 1;

  oneof result {
    // The caller's overview of the survey. `trash_time` is set when the
    // survey is in Trash.
    SurveyOverview overview = 2;

    // Why the overview isn't available: `NOT_FOUND` when the survey doesn't
    // exist or was purged, `PERMISSION_DENIED` when the caller has no access.
    // Values are `google.rpc.Code` numbers.
    int32 error_code = 3;
  }
}

// Response with one result per requested survey, in request order.
message BatchGetSurveyOverviewsResponse {
  repeated SurveyOverviewResult results = 1;
}

// Query over the public directory of surveys.
message SearchPublicSurveysRequest {
  // Case-insensitive keyword matched against survey title and description.
  // Empty lists every public survey.
  string query = 1;

  // Maximum number of overviews to return. The server picks a default when
  // unset and caps large values.
  int32 page_size = 2;

  // `next_page_token` from the previous page of the same query.
  string page_token = 3;
}

// A page of public survey overviews.
message SearchPublicSurveysResponse {
  repeated SurveyOverview overviews = 1;

  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}
