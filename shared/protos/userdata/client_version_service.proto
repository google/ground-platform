syntax = "proto3";

package openforis.collectone.v1.userdata;

// Manages mobile client version policy: suggesting updates when a newer release
// is available and enforcing a minimum required version set by platform admins.
service ClientVersionService {
  // Returns the current mobile client version policy.
  rpc GetClientVersionPolicy(GetClientVersionPolicyRequest) returns (GetClientVersionPolicyResponse);

  // Updates the mobile client version policy (platform administrators only).
  rpc UpdateClientVersionPolicy(UpdateClientVersionPolicyRequest) returns (UpdateClientVersionPolicyResponse);
}

// Server-side policy controlling mobile client update prompts and enforcement.
message ClientVersionPolicy {
  // Latest available mobile client version (SemVer, e.g. "2.1.0").
  // Mobile clients older than this receive a dismissible update suggestion.
  string latest_mobile_version = 1;

  // Minimum required mobile client version (SemVer, e.g. "2.0.0").
  // Mobile clients older than this are blocked by the server and prompted to
  // update before continuing.
  string min_required_mobile_version = 2;

  // Optional store or download URL opened when the user chooses to update.
  string mobile_update_url = 3;
}

message GetClientVersionPolicyRequest {}

message GetClientVersionPolicyResponse {
  ClientVersionPolicy policy = 1;
}

message UpdateClientVersionPolicyRequest {
  ClientVersionPolicy policy = 1;
}

message UpdateClientVersionPolicyResponse {
  ClientVersionPolicy policy = 1;
}
