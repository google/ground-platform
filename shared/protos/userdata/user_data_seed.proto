syntax = "proto3";

package groundplatform.v2.userdata;

import "shared/protos/data/data_service.proto";
import "shared/protos/data/entity_record.proto";
import "shared/protos/data/submission_record.proto";
import "shared/protos/library/library_service.proto";
import "shared/protos/survey/acl.proto";
import "shared/protos/survey/organization.proto";
import "shared/protos/survey/survey_def.proto";

// Initial state of the user data service (`server/userDataService`), loaded
// at startup. Records carry their `commit_timestamp`, so the service resumes its
// server clock after the latest one.
//
// The sample snapshot is generated from the Kotlin fixtures in
// `shared/app/testing` (see `UserDataSeedGenerator`) and checked in as
// `server/userDataService/src/main/resources/seed/user_data_seed.json`.
message UserDataSeed {
  repeated groundplatform.v2.survey.Organization organizations = 1;
  repeated groundplatform.v2.library.OrganizationLibraryRecord libraries = 2;
  repeated SurveySeed surveys = 3;
  repeated groundplatform.v2.data.PlaceRecord places = 4;
  repeated groundplatform.v2.data.MutationLogRecord mutation_logs = 5;
}

// A survey with its access rules, optional working copy, and data.
message SurveySeed {
  // Latest saved revision.
  groundplatform.v2.survey.SurveyDef survey = 1;

  groundplatform.v2.survey.SurveyAcl acl = 2;

  // Organizer's working copy, if the survey has unsaved edits.
  groundplatform.v2.survey.SurveyDef working_copy = 3;

  repeated groundplatform.v2.data.EntityRecord entities = 4;
  repeated groundplatform.v2.data.SubmissionRecord submissions = 5;
}
