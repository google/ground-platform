syntax = "proto3";

package openforis.collectone.v1.data;

import "google/protobuf/timestamp.proto";
import "shared/protos/data/audit_record.proto";
import "shared/protos/data/geometry.proto";
import "shared/protos/forms/record_instance.proto";

// Organizer QA/QC review status for a submission.
enum ReviewStatus {
  REVIEW_STATUS_UNSPECIFIED = 0;
  REVIEW_STATUS_PENDING = 1;
  REVIEW_STATUS_APPROVED = 2;
  REVIEW_STATUS_FLAGGED = 3;
  REVIEW_STATUS_REJECTED = 4;
}

// Denormalized question-and-answer summary entry for fast list/card display.
message SubmissionFieldEntryDef {
  string question_name = 1;
  string question_label = 2;
  string answer_value = 3;
}

// Polygon geometry overlay recorded as an answer to a geometry question inside
// a form submission.
message SubmissionGeometryPolygonDef {
  string id = 1;
  string submission_id = 2;
  string entity_id = 3;
  string layer_id = 4;
  string form_id = 5;
  string form_title = 6;
  string field_path = 7;
  string question_label = 8;
  string short_map_badge = 9;
  string collector_name = 10;
  // Formerly a stored display time; derived from the parent submission's
  // `client_updated_at` / `server_updated_at` instead.
  reserved 11;
  reserved "timestamp_label";
  double area_hectares = 12;
  int32 vertex_count = 13;

  // Formerly a rectangle on the survey's sample map: its normalized center
  // (`normalized_x`, `normalized_y`) and size (`width_fraction`,
  // `height_fraction`). Clients read rows that still carry it as described in
  // `docs/technical/model/data/05-geometry.md`.
  reserved 14 to 17;
  reserved "normalized_x", "normalized_y", "width_fraction", "height_fraction";

  int64 color_hex = 18;

  // The recorded geometry in WGS 84.
  Geometry geometry = 19;
}

// A finalized, versioned submission transaction record.
message SubmissionRecord {
  // Globally unique submission UUID matching RecordMetadata.instance_id.
  string submission_id = 1;

  // Survey identifier to which this submission belongs.
  string survey_id = 2;

  // Form identifier within the survey.
  string form_id = 3;

  // Form version active at the time of data collection, enabling historical
  // reconstruction.
  string form_version = 4;

  // Linked entity ID if this submission was collected against a lookup table
  // or geospatial entity. Empty for standalone submissions.
  string entity_id = 5;

  // Version of the record, incremented on every write to the submission,
  // including deletes. Clients keep the copy with the higher revision;
  // `SubmissionMutation.base_revision` refers to it.
  int64 revision = 6;

  // Provenance metadata including start/end timestamps, device ID, and audit
  // file URI.
  openforis.collectone.v1.forms.RecordMetadata metadata = 7;

  // Populated form submission record instance or its serialized bytes.
  oneof payload {
    // Populated form submission record instance containing all captured field
    // answers, nested groups, repeat items, and client session data.
    openforis.collectone.v1.forms.RecordInstance record = 8;

    // Serialized protobuf primary record payload bytes.
    bytes raw_payload = 9;
  }

  // Audit metadata recording creation, collector identity, and sync timestamps.
  // Server-owned: the server stamps it on each write that creates or changes
  // the submission (who from the authenticated caller, when from its clock) and
  // ignores any value a mutation carries.
  AuditInfo audit_info = 11;

  // Soft deletion status flag.
  bool is_deleted = 12;

  // Authoritative server commit timestamp of the last write. For display only:
  // clients compare versions, not timestamps, to tell which copy is newer
  // (`docs/technical/sync-engine.md`, "Sync Tokens").
  google.protobuf.Timestamp commit_timestamp = 13;

  // QA/QC review status assigned by a survey organizer.
  ReviewStatus review_status = 14;

  // True when the contributor or submission is quarantined from consensus and
  // exports.
  bool is_quarantined = 15;

  // Human-readable label of the linked entity (`entity_id`), if any.
  string entity_label = 16;

  // Human-readable title of the form (`form_id`).
  string form_title = 17;

  // Display name of the collector who recorded this submission.
  string collector_name = 18;

  // Email address of the collector who recorded this submission.
  string collector_email = 19;

  // Formerly a stored display time (e.g., "2026-09-24 14:22 UTC"). Clients
  // derive it from `client_updated_at`, falling back to `server_updated_at`.
  reserved 20;
  reserved "timestamp_label";

  // The survey author's singular noun for the type of the target entity (e.g.,
  // "Coffee Parcel"), or empty for a standalone submission (no `entity_id`)
  // or when the author gave none; clients name those in the user's language.
  // Rows written by older clients may hold their English texts "Location" or
  // "Standalone Field Log", which clients read as empty.
  string target_type_label = 21;

  // Synchronization status key (`"SYNCED"`, `"UPLOADING"`, `"FAILED"`).
  string sync_status_key = 22;

  // Formerly the collector's position as display text (`coordinates_label`)
  // and as a normalized position on the survey's sample map (`normalized_x`,
  // `normalized_y`); replaced by `location`. Clients read rows that still carry
  // them as described in `docs/technical/model/data/05-geometry.md`.
  reserved 23 to 25;
  reserved "coordinates_label", "normalized_x", "normalized_y";

  // Denormalized question-and-answer entries for preview cards and lists.
  repeated SubmissionFieldEntryDef field_entries = 26;

  // Polygon geometry overlays captured within this submission.
  repeated SubmissionGeometryPolygonDef geometry_polygons = 27;

  // When the collector last saved this submission, in the client device's
  // clock. Set by the client on every create or edit; display text prefers it
  // because it is when the work happened, even if the upload was later.
  google.protobuf.Timestamp client_updated_at = 28;

  // When the server accepted the last mutation of this submission, in the
  // server's clock. Server-owned: the server stamps it on every accepted
  // `SubmissionMutation` and ignores any value a client sends. Unlike
  // `commit_timestamp`, it is stored in the record.
  google.protobuf.Timestamp server_updated_at = 29;

  // Where the collector was when they recorded this submission: a WGS 84
  // point, or unset when unknown. Clients show it for submissions without a
  // map feature and navigate to it.
  Geometry location = 30;
}
