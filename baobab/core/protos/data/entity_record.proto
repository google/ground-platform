syntax = "proto3";

package groundplatform.v2.data;

import "core/protos/data/audit_record.proto";
import "core/protos/forms/types.proto";

// A persistent, versioned entity record within an ODK Entity Dataset.
message EntityRecord {
  // Unique entity UUID (RFC 4122 v4).
  string entity_id = 1;

  // Entity Dataset ID to which this entity belongs (`EntityDatasetDef.id`).
  string dataset_id = 2;

  // Sequential revision number (increments with every edit).
  int64 revision = 3;

  // Human-readable entity label.
  string label = 4;

  // Spatial geometry associated with this geospatial entity (if type is
  // GEOSPATIAL). Exposed to ODK / ProtoForms XPath expressions and
  // `entity_saveto` bindings under the reserved system property name
  // `"geometry"`. Topological guardrail: Maximum 50 vertices per polygon.
  oneof geometry {
    groundplatform.v2.forms.GeoPoint point = 5;
    groundplatform.v2.forms.GeoTrace trace = 6;
    groundplatform.v2.forms.GeoShape shape = 7;
  }

  // Key-value attribute properties stored for this entity.
  map<string, groundplatform.v2.forms.TypedValue> properties = 8;

  // Audit metadata recording creation and last modification.
  AuditInfo audit_info = 9;

  // True if registered opportunistically by a field collector on mobile.
  bool is_field_created = 10;

  // Soft deletion status flag.
  bool is_deleted = 11;
}
