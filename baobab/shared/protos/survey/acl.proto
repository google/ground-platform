syntax = "proto3";

package groundplatform.v2.survey;

// Collaborator organizational roles within a survey or resource.
enum Role {
  // Unspecified role.
  ROLE_UNSPECIFIED = 0;

  // Viewer: Read-only access enabling map navigation, entity inspection, and
  // submission viewing while hiding/disabling collection and editing actions.
  VIEWER = 1;

  // Data Collector: Field enumerator or desk photo-interpreter authorized to
  // collect submissions and register ad-hoc geospatial entities.
  DATA_COLLECTOR = 2;

  // Survey Organizer: Project supervisor/manager authorized to edit forms,
  // manage ACLs, publish schemas, review conflicts, and export data.
  SURVEY_ORGANIZER = 3;
}

// Single collaborator entry in an Access Control List (ACL).
message AclEntry {
  // Unique identifier of the user (e.g., Firebase Auth UID).
  string user_id = 1;

  // Assigned role governing permissions.
  Role role = 2;

  // Invitation status for the collaborator.
  enum InvitationStatus {
    // Unspecified status.
    INVITATION_STATUS_UNSPECIFIED = 0;

    // Invitation dispatched; awaiting recipient acceptance.
    PENDING = 1;

    // Invitation accepted; survey populated in user's library.
    ACCEPTED = 2;
  }
  InvitationStatus invitation_status = 3;
}

// Sharing policy controlling survey access outside explicit ACL invitations
// (mirroring the Google Docs / Google Drive sharing model).
enum SharingPolicy {
  // Unspecified sharing policy.
  SHARING_POLICY_UNSPECIFIED = 0;

  // Restricted: Only users explicitly added to the survey Access Control
  // List (ACL) can open and access the survey.
  RESTRICTED = 1;

  // Anyone with the link: Anyone who possesses the survey URL link or scans
  // its QR code can access the survey and collect data without being on the
  // ACL.
  ANYONE_WITH_LINK = 2;

  // Public: Discoverable in the public directory; anyone can open and
  // collect data.
  PUBLIC = 3;
}

// Peer data visibility controls for mobile field collectors.
enum PeerDataVisibility {
  // Unspecified visibility.
  PEER_DATA_VISIBILITY_UNSPECIFIED = 0;

  // Field collectors can view entities and submissions collected by all peers
  // on the map to coordinate coverage and prevent duplicate registrations.
  ALL = 1;

  // Field collectors can only view their own collected submissions and entities
  // to preserve respondent confidentiality.
  OWN_ONLY = 2;
}

// Access Control List (ACL) and access rules governing collaborator permissions
// and general visibility for a survey.
message SurveyAcl {
  // Unique identifier of the survey.
  string survey_id = 1;

  // Collaborator Access Control List entries.
  repeated AclEntry entries = 2;

  // Sharing policy controlling general access to the survey (Restricted,
  // Anyone with Link / QR Code, Public).
  SharingPolicy sharing_policy = 3;

  // Peer data visibility configuration controlling whether data collectors can
  // view submissions and entities collected by peers on the map.
  PeerDataVisibility peer_data_visibility = 4;
}

// Resource quota tier applied to survey organizers and organizations.
enum QuotaTier {
  // Unspecified quota tier.
  QUOTA_TIER_UNSPECIFIED = 0;

  // Basic Tier: Default tier for free and community usage.
  BASIC = 1;

  // Sponsored Tier: Expanded capacity for verified non-profits and partner
  // institutions.
  SPONSORED = 2;
}

// Tiered quota limits and resource constraints governing survey creation,
// collaborator access, and operational field collection.
message QuotaLimits {
  // Tier classification: Basic Tier (default) or Sponsored Tier.
  QuotaTier tier = 1;

  // --- Tiered Survey Organizer Limits (Administrative scopes) ---

  // Maximum surveys an owner can create (Basic: 5, Sponsored: 100).
  int32 max_surveys_per_owner = 2;

  // Maximum forms allowed per survey (Basic: 5, Sponsored: 10).
  int32 max_forms_per_survey = 3;

  // Maximum questions/tasks per form (Basic: 10, Sponsored: 50).
  int32 max_questions_per_form = 4;

  // Maximum photo questions per form (Basic: 1, Sponsored: 10).
  int32 max_photo_questions_per_form = 5;

  // Maximum predefined geospatial entities (Basic: 1,000, Sponsored: 10,000).
  int32 max_predefined_entities = 6;

  // Maximum users in the Access Control List (Basic: 10, Sponsored: 50).
  int32 max_acl_users = 7;

  // --- Tiered Data Collection Limits (Operational / field scopes) ---

  // Maximum surveys a field collector can join (Basic: 5, Sponsored: 100).
  int32 max_surveys_per_user = 8;

  // Maximum ad-hoc / field-created entities per user (Basic: 100, Sponsored:
  // 200).
  int32 max_adhoc_entities_per_user = 9;

  // Maximum submissions per predefined entity per user (Basic: 10, Sponsored:
  // 50).
  int32 max_submissions_per_entity_per_user = 10;
}
