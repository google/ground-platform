syntax = "proto3";

package groundplatform.v2.forms;

import "shared/protos/forms/types.proto";
import "google/protobuf/timestamp.proto";

// Client audit logging configuration defining telemetry collection policies,
// background GPS sampling rates, and change-tracking behavior.
message AuditConfig {
  // Whether client audit logging is enabled for this form session.
  bool enabled = 1;

  // Minimum time interval in seconds between background GPS location fixes.
  // Lower intervals increase location precision at the cost of higher battery
  // usage.
  int32 location_min_interval_seconds = 2;

  // Maximum acceptable age in seconds for cached GPS readings before requesting
  // a fresh location fix from the hardware sensor.
  int32 location_max_age_seconds = 3;

  // Desired location provider accuracy profile (e.g., "high_accuracy",
  // "balanced", "low_power", "no_power").
  string location_priority = 4;

  // When true, all question edits record old_value and new_value snapshots
  // in the audit trail.
  bool track_changes = 5;

  // Optional comma-separated reason codes or UI prompt instructions required
  // from the enumerator when editing previously answered questions.
  string track_changes_reasons = 6;
}

// Single audit telemetry event recorded during client form interaction.
message AuditEvent {
  // Event identifier (e.g. "form start", "form exit", "question", "group",
  // "form save", "form finalize").
  string event = 1;

  // Dot- or slash-separated field path of the active question or group (e.g.
  // "household.person[0].age").
  string field_path = 2;

  // Timestamp when interaction with this question/group began or focus was
  // gained.
  google.protobuf.Timestamp start_time = 3;

  // Timestamp when interaction concluded or focus moved to another question.
  google.protobuf.Timestamp end_time = 4;

  // Geospatial coordinate recorded during this event, if location tracking is
  // active.
  GeoPoint location = 5;

  // Value before edit, recorded if track_changes is enabled in AuditConfig.
  string old_value = 6;

  // Value after edit, recorded if track_changes is enabled in AuditConfig.
  string new_value = 7;
}

// Complete audit log session record tracking enumerator interactions, timing,
// and location breadcrumbs.
message AuditLog {
  // Chronological list of recorded audit telemetry events.
  repeated AuditEvent events = 1;
}
