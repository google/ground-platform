syntax = "proto3";

package groundplatform.v2.forms;

import "shared/protos/forms/audit_log.proto";
import "shared/protos/forms/types.proto";
import "google/protobuf/timestamp.proto";

// Standard form metadata header tracking submission provenance, timestamps,
// device identity, and audit references.
message RecordMetadata {
  // Globally unique submission record UUID (RFC 4122 v4), typically prefixed
  // with "uuid:".
  string instance_id = 1;

  // Timestamp when the form entry session was started on the client.
  google.protobuf.Timestamp start_time = 2;

  // Timestamp when the form entry was completed and finalized.
  google.protobuf.Timestamp end_time = 3;

  // Timestamp or date representing the day the form was completed.
  google.protobuf.Timestamp today = 4;

  // Unique hardware identifier, Android ID, or install UUID of the client
  // device.
  string device_id = 5;

  // International Mobile Subscriber Identity (IMSI) of the client SIM, if
  // available.
  string subscriber_id = 6;

  // SIM card serial number (ICCID) of the client device, if available.
  string sim_serial = 7;

  // Phone number of the client device, if available.
  string phone_number = 8;

  // Relative filename or URI pointing to the attached audit log file (e.g.,
  // "audit.csv").
  string audit_file_uri = 9;

  // Audit logging telemetry configuration governing background sensor
  // recording.
  AuditConfig audit_config = 10;
}

// A list of scalar/composite typed values, used for multi-select questions
// (TYPE_SELECT_MULTIPLE) or repeated primitive fields.
message TypedValueList {
  // Ordered list of typed literal values.
  repeated TypedValue values = 1;
}

// A list of nested record nodes, used for repeat groups (RepeatDef).
message RecordNodeList {
  // Ordered list of repeat item instances.
  repeated RecordNode nodes = 1;
}

// A single populated field value within a form record instance.
// Allows clients to traverse, read, and write form data using standard
// code-generated protobuf accessors without relying on protobuf reflection.
message FieldValue {
  // The concrete value kind for this field.
  oneof kind {
    // Single scalar, date/time, geospatial, or binary value.
    TypedValue scalar_value = 1;

    // List of values (e.g., for TYPE_SELECT_MULTIPLE or repeated primitives).
    TypedValueList list_value = 2;

    // Nested structured group instance (for TYPE_MESSAGE / GroupDef).
    RecordNode node_value = 3;

    // Ordered list of repeat group instances (for RepeatDef).
    RecordNodeList repeat_value = 4;
  }
}

// A hierarchical container of field values representing a root form record,
// a nested group, or a single repeat item instance.
message RecordNode {
  // Populated field values keyed by their field name within this scope.
  map<string, FieldValue> fields = 1;
}

// A complete, strongly-typed form submission record instance produced by
// ProtoForms.
//
// Using RecordInstance as the standard code-generated submission message allows
// mobile, web, and server runtimes to process, validate, and serialize any
// form's data without requiring dynamic schema compilation or protobuf
// reflection.
message RecordInstance {
  // Globally unique identifier of the form definition (FormDef.form_id).
  string form_id = 1;

  // Version of the form definition (FormDef.version) under which this record
  // was collected.
  string form_version = 2;

  // Standard form submission metadata header (instance UUID, timestamps,
  // device identity, audit log reference).
  RecordMetadata metadata = 3;

  // Root hierarchical data tree containing all captured form answers, groups,
  // and repeat instances.
  RecordNode data = 4;

  // Optional client interaction audit log recorded during this session.
  AuditLog audit_log = 5;
}
