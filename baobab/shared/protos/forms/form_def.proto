syntax = "proto3";

package groundplatform.v2.forms;

import "shared/protos/forms/record_instance.proto";
import "shared/protos/forms/types.proto";
import "google/protobuf/any.proto";

// Automated preload calculation providers for populating system metadata,
// device identifiers, and timestamps without requiring manual user input.
enum PreloadType {
  // Unspecified or inactive preloader.
  PRELOAD_UNSPECIFIED = 0;

  // Form timing timestamps (e.g., "start" on first load, "end" on
  // save/finalize).
  PRELOAD_TIMESTAMP = 1;

  // Current local calendar date (e.g., "today" on form first load).
  PRELOAD_DATE = 2;

  // Current local time of day.
  PRELOAD_TIME = 3;

  // Globally unique identifier generation (RFC 4122 v4 UUID prefixed with
  // "uuid:").
  PRELOAD_UID = 4;

  // Client device or user environment properties (e.g., "deviceid", "email",
  // "username", "phonenumber", "simserial", "subscriberid").
  PRELOAD_PROPERTY = 5;

  // Session context parameter provided by the launching application or
  // workflow.
  PRELOAD_CONTEXT = 6;
}

// Dynamic schema definition for a field in a record schema.
// Used when building dynamic primary instance records or validating inputs at
// runtime.
message FieldDefinition {
  // Field identifier matching the property name in the record data model.
  string name = 1;

  // Data type of this field.
  DataType type = 2;

  // Whether this field is a repeated list (e.g., for repeat groups or
  // multi-select items).
  bool is_repeated = 3;

  // Child field definitions when type is TYPE_MESSAGE or a nested composite
  // group.
  repeated FieldDefinition fields = 4;

  // Optional fully qualified protobuf message type name for custom compiled
  // schemas.
  string type_name = 5;
}

// Dynamic schema defining the structure, fields, and text-serialization
// settings of the form primary instance.
message RecordSchema {
  // Root schema identifier or top-level message name for the primary instance.
  string name = 1;

  // Human-readable title of the data record schema.
  string title = 2;

  // Top-level field definitions constituting the form record structure.
  repeated FieldDefinition fields = 3;

  // Optional command prefix prepended to compact SMS/text representations
  // (e.g., "hh").
  string sms_prefix = 4;

  // Delimiter character separating tags and values in compact SMS/text
  // representations (defaults to single space ' ' if unset).
  string sms_delimiter = 5;
}

// Primary instance container describing the data record generated by this form.
message PrimaryInstance {
  // Dynamic schema describing fields, hierarchy, and SMS configuration.
  RecordSchema record_schema = 1;

  // Optional default initial record values populated when a new form instance
  // is created, structured using the code-generated RecordNode message.
  RecordNode default_values = 2;

  // Fully qualified protobuf message name if using pre-compiled, code-generated
  // message classes instead of dynamic schemas.
  string message_type_name = 3;
}

// Secondary lookup dataset instance providing external or inline read-only
// data for choice lists, cascading dropdowns, and lookup queries.
message SecondaryInstance {
  // Unique instance identifier referenced in expressions via instance('id').
  // In hosted, database-backed runtimes (such as Ground), this id implicitly
  // binds to a managed ODK Entity Dataset (EntityDatasetDef).
  string id = 1;

  // External resource URI pointing to CSV, GeoJSON, or XML data
  // (e.g., "jr://file-csv/cities.csv", "jr://file/boundaries.geojson").
  // In hosted runtimes, this serves as a logical binding and serialization
  // descriptor for XForms/XLSForm round-tripping.
  string uri = 2;

  // Inline data payload (CSV, JSON, or textproto) embedded directly within
  // the form definition when external files are not used.
  string inline_data = 3;
}

// Binding rule attaching data types, validation logic, reactive calculations,
// skip logic, and integration metadata to a field path in the primary instance.
message FieldBinding {
  // Relative or absolute path to the target field within the primary instance
  // (e.g., "firstname", "person/age", "/household/person/age").
  string field_path = 1;

  // Data type for input validation, parsing, and native storage.
  DataType type = 2;

  // Whether user editing is disabled for this field. When true, values can
  // only be populated via calculations, defaults, or preloads.
  bool read_only = 3;

  // Relevancy (skip logic) boolean expression. When evaluating to false, the
  // field is hidden from the UI and omitted from the submitted record.
  string relevant_expression = 4;

  // Reactive expression computing the value of this field automatically
  // whenever dependency fields change.
  string calculate_expression = 5;

  // Validation constraint expression evaluating user input. Evaluated only
  // when the field is non-empty; input is rejected if evaluating to false.
  string constraint_expression = 6;

  // Boolean expression indicating whether a non-empty answer is required
  // before the form can be finalized.
  string required_expression = 7;

  // Custom localized or literal error message displayed when the constraint
  // expression evaluates to false.
  string constraint_message = 8;

  // Custom localized or literal error message displayed when the required
  // expression check fails.
  string required_message = 9;

  // Short alphanumeric tag used to identify this field in compact SMS or
  // low-bandwidth text representations (e.g., "fn", "age").
  string sms_tag = 10;

  // Target property name when publishing this field's value to an Entity
  // Dataset.
  string entity_saveto = 11;

  // Maximum long-edge pixel dimension for image attachments. Images exceeding
  // this size are downsampled proportionally upon capture.
  int32 max_pixels = 12;

  // Preloader provider type for auto-populating system metadata.
  PreloadType preload = 13;

  // Parameter passed to the preloader (e.g., "start", "end", "deviceid",
  // "username").
  string preload_param = 14;

  // Typed extension messages for proprietary, vendor, or experimental binding
  // attributes.
  repeated google.protobuf.Any custom_extensions = 15;
}

// Media attachment references for prompt images, audio clips, and instructional
// videos.
message MediaRef {
  // Standard display/thumbnail image URI (JPEG, PNG, GIF, SVG, WebP).
  string image_uri = 1;

  // High-resolution image URI opened in full-screen modal pan-and-zoom viewers.
  string big_image_uri = 2;

  // Audio prompt or question readout playback URI (MP3, AAC, OGG, WAV).
  string audio_uri = 3;

  // Instructional or demonstration video clip URI (MP4, WebM).
  string video_uri = 4;
}

// Localized string variants providing translations, short labels, guidance
// hints, and associated media for a question or choice option.
message LocalizedString {
  // Primary localized text content for labels, prompts, or messages.
  string value = 1;

  // Optional short label variant for compact displays, mobile navigation, or
  // summary tables.
  string short_value = 2;

  // Optional secondary instructional guidance hint for enumerator training or
  // expandable help panels.
  string guidance_value = 3;

  // Multi-modal media attachments (image, high-res image, audio prompt, video)
  // for this translation.
  MediaRef media = 4;
}

// Complete dictionary of translated strings and media for a single language.
message LanguageTranslation {
  // Language identifier or BCP-47 tag (e.g., "English", "es-MX", "Français",
  // "sw").
  string language = 1;

  // Whether this is the default initial active language when the form is
  // opened.
  bool is_default = 2;

  // Translation table mapping text identifier keys (text_id) to localized
  // string definitions.
  map<string, LocalizedString> strings = 3;
}

// Multi-lingual catalog containing all language translation dictionaries for
// the form.
message TranslationCatalog {
  // List of language-specific translation tables.
  repeated LanguageTranslation languages = 1;
}

// Form lifecycle events triggering automated actions and calculations.
enum EventType {
  // Unspecified lifecycle event.
  EVENT_TYPE_UNSPECIFIED = 0;

  // Dispatched once when a new form record instance is first created and
  // initialized.
  EVENT_INSTANCE_FIRST_LOAD = 1;

  // Dispatched every time a form record instance is loaded from storage or
  // reopened for editing.
  EVENT_INSTANCE_LOAD = 2;

  // Dispatched whenever the value of the watched source field changes.
  EVENT_VALUE_CHANGED = 3;

  // Dispatched when a new repeat group instance is inserted into the record.
  EVENT_REPEAT_INSERT = 4;
}

// Automated operations executed when a lifecycle event fires.
enum ActionType {
  // Unspecified action type.
  ACTION_TYPE_UNSPECIFIED = 0;

  // Evaluates an expression or literal value and assigns it to the target
  // field.
  ACTION_SET_VALUE = 1;

  // Requests an asynchronous GPS location fix from the client hardware sensor
  // and stores the resulting GeoPoint in the target field.
  ACTION_SET_GEOPOINT = 2;
}

// Declarative rule executing an action in response to a form lifecycle event.
message ActionDef {
  // Lifecycle event(s) that trigger this action.
  repeated EventType events = 1;

  // Type of operation to execute.
  ActionType type = 2;

  // Path to the destination field where the action result will be written.
  string target_field = 3;

  // Expression evaluated dynamically to compute the value assigned to
  // target_field.
  string value_expression = 4;

  // Static literal constant assigned to target_field when value_expression is
  // not used.
  TypedValue literal_value = 5;
}

// Offline synchronization and optimistic concurrency metadata for an entity.
message EntitySyncMetadata {
  // Expression evaluating to the base server version number of the entity
  // being updated.
  string base_version_expression = 1;

  // Expression evaluating to whether this update builds upon a local offline
  // branch rather than the latest server head.
  string trunk_version_expression = 2;

  // Expression evaluating to the local branch ID for offline entity updates.
  string branch_id_expression = 3;
}

// Mapping between a form field and a property in an Entity Dataset.
message EntityPropertyMapping {
  // Destination property name in the Entity Dataset.
  string entity_property = 1;

  // Source field path in the form primary instance.
  string source_field_path = 2;
}

// Configuration declaring how a form submission creates or updates an entity
// in a persistent server-side or offline Entity Dataset.
message EntityDeclaration {
  // Name of the target Entity Dataset (e.g., "trees", "households").
  string dataset = 1;

  // Expression evaluating to the globally unique UUID of the entity being
  // created or updated.
  string entity_id_expression = 2;

  // Expression evaluating to the human-readable label of the entity.
  string label_expression = 3;

  // Boolean expression determining whether a new entity should be created upon
  // submission.
  string create_condition = 4;

  // Boolean expression determining whether an existing entity should be updated
  // upon submission.
  string update_condition = 5;

  // Offline optimistic locking and multi-branch synchronization metadata.
  EntitySyncMetadata sync_metadata = 6;

  // Explicit mappings transferring form fields to entity dataset properties.
  repeated EntityPropertyMapping property_mappings = 7;
}

// Destination endpoint, transmission policies, and cryptographic parameters
// for sending finalized form records.
//
// Clients and form editors are expected to preserve all submission metadata
// (including base64_rsa_public_key) for round-trip compatibility with ODK
// Forms, even if the client relies on transport-layer security (TLS/HTTPS or
// gRPC) rather than payload encryption.
message SubmissionConfig {
  // Optional custom endpoint URL or gRPC service address to send submissions
  // to.
  string action_url = 1;

  // Transmission method (e.g., "POST", "GRPC").
  string method = 2;

  // Base64-encoded RSA public key required to enable asymmetric payload
  // encryption.
  string base64_rsa_public_key = 3;

  // If true, finalized records are queued and transmitted automatically upon
  // network connectivity.
  bool auto_send = 4;

  // If true, records and media attachments are immediately removed from client
  // storage after successful submission.
  bool auto_delete = 5;

  // If true, clients allow enumerators to reopen and edit finalized records
  // before dispatch.
  bool client_editable = 6;
}

// Core data model containing record schemas, secondary lookup instances,
// validation bindings, translations, lifecycle actions, entity declarations,
// and submission parameters.
//
// Clients are expected to preserve all form model metadata and extension
// payloads even if they do not support all features of ODK Forms.
message ModelDef {
  // Primary record schema and field structures captured by this form.
  PrimaryInstance primary_instance = 1;

  // Secondary lookup datasets used for choice lists and cascading queries.
  repeated SecondaryInstance secondary_instances = 2;

  // Validation rules, data types, reactive expressions, and field constraints.
  repeated FieldBinding bindings = 3;

  // Multi-lingual catalog containing localized labels, hints, and media.
  TranslationCatalog translations = 4;

  // Form-level lifecycle actions triggered on initialization or load.
  repeated ActionDef actions = 5;

  // Top-level entity declarations for creating or updating dataset entities.
  repeated EntityDeclaration entities = 6;

  // Standard form metadata header configuration, preloads, and audit
  // parameters.
  RecordMetadata metadata = 7;

  // Destination endpoints, transmission policies, and encryption keys.
  SubmissionConfig submission = 8;

  // Typed extension payloads for custom, vendor, or experimental model
  // properties.
  repeated google.protobuf.Any custom_extensions = 9;
}

// Interactive UI widgets and question display types available in the form view.
enum ControlType {
  // Unspecified control type.
  CONTROL_TYPE_UNSPECIFIED = 0;

  // Free-form text, numeric, date/time, or geospatial coordinate input field.
  CONTROL_INPUT = 1;

  // Single-choice selection widget (radio buttons, dropdown menu, or
  // autocomplete).
  CONTROL_SELECT_ONE = 2;

  // Multiple-choice selection widget (checkboxes or multi-select list).
  CONTROL_SELECT_MULTIPLE = 3;

  // Numeric slider or step-picker within a bounded min/max range.
  CONTROL_RANGE = 4;

  // Binary file attachment uploader (camera capture, audio recorder, signature
  // pad, document picker).
  CONTROL_UPLOAD = 5;

  // Simple acknowledgement button or read-only informational note.
  CONTROL_TRIGGER = 6;

  // Interactive drag-and-drop ordering widget for ranking a list of choices.
  CONTROL_RANK = 7;
}

// Dynamic output interpolation fragment embedded within a question label or
// hint string (replacing XForms `<output value="..."/>`).
message OutputFragment {
  // Placeholder identifier within the label text (e.g., "${person_name}" or
  // "{0}").
  string placeholder_id = 1;

  // Expression evaluated at runtime whose formatted string result replaces the
  // placeholder.
  string value_expression = 2;
}

// Question or group label/hint text supporting static strings, multi-lingual
// translation IDs, and dynamic output expressions.
message LabelDef {
  // Direct static text content (used when multi-lingual translation tables are
  // not required).
  string text = 1;

  // Translation dictionary lookup key referencing LocalizedString entries in
  // ModelDef.translations.
  string text_id = 2;

  // Dynamic output expressions interpolated into the rendered text string.
  repeated OutputFragment outputs = 3;
}

// Static choice item option within a select_one, select_multiple, or rank
// control.
message ChoiceItem {
  // Underlying machine-readable value stored in the data record when selected.
  string value = 1;

  // Human-readable label and/or media displayed for this option.
  LabelDef label = 2;

  // Optional custom properties attached to this choice option for cascading
  // filters.
  map<string, string> properties = 3;
}

// Dynamic choice itemset query populating options from a SecondaryInstance
// dataset.
message ItemsetDef {
  // Identifier of the SecondaryInstance dataset to query (e.g., "cities").
  string instance_id = 1;

  // Filter expression selecting a subset of rows from the dataset (e.g.,
  // "country = /household/country").
  string nodeset_filter = 2;

  // Column/property name in the dataset row providing the option's stored
  // value.
  string value_ref = 3;

  // Column/property name in the dataset row providing the option's displayed
  // label or text_id.
  string label_ref = 4;

  // When true, choice options are shuffled into a random order each time the
  // question is displayed to prevent order bias.
  bool randomize = 5;

  // Optional expression or field reference supplying a deterministic PRNG seed
  // for reproducible randomization.
  string random_seed_expression = 6;
}

// Configuration parameters for CONTROL_RANGE slider and picker widgets.
message RangeConfig {
  // Minimum bound of the range (inclusive).
  double start = 1;

  // Maximum bound of the range (inclusive).
  double end = 2;

  // Increment step size between selectable values.
  double step = 3;

  // Visual tick mark interval along the slider track.
  double tick_interval = 4;
}

// Configuration parameters for geospatial capture controls (geopoint, geotrace,
// geoshape).
//
// Matches ODK XForms accuracy attributes on `<input>` and XLSForm parameters.
message GeoConfig {
  // Target horizontal accuracy threshold in meters for auto-acceptance.
  // Once sensor accuracy meets or beats this threshold, the capture dialog
  // automatically accepts the reading and closes.
  // Corresponds to ODK XForms `<input accuracyThreshold="...">` and XLSForm
  // `capture-accuracy` / `body::accuracyThreshold`.
  double accuracy_threshold_meters = 1;

  // Horizontal accuracy threshold in meters above which the UI displays an
  // uncertainty warning (e.g., red dialog in ODK Collect).
  // Corresponds to ODK XForms `<input unacceptableAccuracyThreshold="...">` and
  // XLSForm `warning-accuracy` / `body::unacceptableAccuracyThreshold`.
  double warning_threshold_meters = 2;

  // Whether mock location provider readings from external GNSS apps or
  // developer options are accepted.
  // Corresponds to XLSForm parameter `allow-mock-accuracy=true`.
  bool allow_mock_accuracy = 3;
}

// Configuration for launching an external Android/iOS application or custom URI
// intent to capture data for a question or group.
message IntentConfig {
  // Platform intent URI or action string (e.g.,
  // "org.opendatakit.sensors.PULSE_OXIMETER").
  string intent_uri = 1;

  // Key-value parameters passed as intent extras when launching the external
  // application. Keyed by extra name, valued by XPath/expression or literal.
  map<string, string> parameters = 2;

  // Mapping from returned intent result keys to target field paths in the
  // primary instance.
  map<string, string> response_mappings = 3;
}

// Single interactive form control widget displayed in the user interface.
message ControlDef {
  // Target field path in the primary instance bound to this UI control.
  string field_ref = 1;

  // Type of UI widget to render.
  ControlType type = 2;

  // Primary prompt label displayed above the control.
  LabelDef label = 3;

  // Secondary helper hint displayed below the label.
  LabelDef hint = 4;

  // Space-separated appearance tokens customizing widget layout and behavior
  // (e.g., "minimal", "quick", "likert", "multiline", "thousands-sep",
  // "image-map").
  string appearance = 5;

  // Static list of selectable choice options (for SELECT_ONE, SELECT_MULTIPLE,
  // RANK).
  repeated ChoiceItem choices = 6;

  // Dynamic itemset query populating choices from a secondary instance.
  ItemsetDef itemset = 7;

  // Range configuration parameters (when type is CONTROL_RANGE).
  RangeConfig range_config = 8;

  // Accepted MIME media types for upload controls (e.g., "image/*", "audio/*",
  // "application/pdf").
  string media_type = 9;

  // External app intent launch configuration.
  IntentConfig intent = 10;

  // Lifecycle actions triggered specifically by UI interactions on this control
  // (e.g., setvalue on xforms-value-changed).
  repeated ActionDef actions = 11;

  // Typed extension payloads for custom UI widget configurations.
  repeated google.protobuf.Any custom_extensions = 12;

  // Geospatial capture parameters (when bound to a GEOPOINT, GEOTRACE, or
  // GEOSHAPE field).
  GeoConfig geo_config = 13;
}

// Logical and visual grouping of related form components.
message GroupDef {
  // Optional target field path if this group corresponds to a nested message
  // node in the primary instance.
  string field_ref = 1;

  // Group section header label.
  LabelDef label = 2;

  // Visual layout appearance (e.g., "field-list" to display all children on a
  // single screen, "collapsible", "compact").
  string appearance = 3;

  // External application intent capable of populating multiple fields within
  // this group simultaneously.
  IntentConfig intent = 4;

  // Ordered sequence of child components (controls, subgroups, repeats) inside
  // this group.
  repeated ViewComponent components = 5;
}

// Repeatable section allowing enumerators to collect zero, one, or multiple
// instances of a structured sub-record (e.g. household members, plot corners).
message RepeatDef {
  // Target repeated field path in the primary instance (e.g.
  // "/household/person").
  string field_ref = 1;

  // Header label displayed for each repeat instance card or screen.
  LabelDef label = 2;

  // Visual layout appearance (e.g. "field-list", "table-list").
  string appearance = 3;

  // Expression evaluating to the fixed or dynamic number of repeat instances to
  // generate automatically (replaces `jr:count`).
  string count_expression = 4;

  // When true, prevents enumerators from manually adding or deleting repeat
  // instances in the UI (replaces `jr:noAddRemove`).
  bool no_add_remove = 5;

  // Ordered sequence of child components rendered inside each repeat instance.
  repeated ViewComponent components = 6;
}

// Polymorphic UI element within the form view hierarchy.
message ViewComponent {
  // The specific UI component variant.
  oneof component {
    // Interactive question control widget.
    ControlDef control = 1;

    // Visual or logical group container.
    GroupDef group = 2;

    // Repeatable section container.
    RepeatDef repeat = 3;
  }
}

// Complete user interface presentation definition for a form.
message ViewDef {
  // Top-level ordered sequence of controls, groups, and repeat sections.
  repeated ViewComponent components = 1;
}

// Top-level form definition encapsulating schema, logic, translations, and user
// interface layout.
message FormDef {
  // Globally unique identifier for this form definition across all versions.
  string form_id = 1;

  // Human-readable title of the form displayed in client form listings and
  // header bars.
  string title = 2;

  // Version string (e.g. "2026090901") used for tracking revisions and
  // submission compatibility.
  string version = 3;

  // Default language code matching an entry in ModelDef.translations (e.g.
  // "English", "es-MX").
  string default_language = 4;

  // Data model defining schemas, instances, field bindings, translations,
  // actions, and submission settings.
  ModelDef model = 5;

  // View presentation hierarchy defining controls, groups, repeats, and display
  // order.
  ViewDef view = 6;

  // Typed extension payloads for custom, vendor, or experimental form-level
  // metadata. Clients are expected to preserve all metadata and extension
  // payloads even if they do not support all features of ODK Forms.
  repeated google.protobuf.Any custom_extensions = 7;
}
