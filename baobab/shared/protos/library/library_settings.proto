syntax = "proto3";

package groundplatform.v2.library;

// Per-organization library preferences.
message OrganizationLibrarySettings {
  string organization_id = 1;

  // Global template and Purpose Pack IDs hidden from this organization's
  // survey-creation and "From template" pickers. Global concepts cannot be
  // hidden.
  repeated string hidden_global_entry_ids = 2;
}
