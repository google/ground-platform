syntax = "proto3";

package groundplatform.v2.data;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "shared/protos/data/audit_record.proto";
import "shared/protos/data/entity_record.proto";
import "shared/protos/data/impact_aggregate.proto";
import "shared/protos/data/impact_event.proto";
import "shared/protos/data/submission_record.proto";
import "shared/protos/forms/audit_log.proto";
import "shared/protos/forms/encrypted_submission.proto";
import "shared/protos/forms/record_instance.proto";
import "shared/protos/forms/types.proto";

// Core gRPC service for reading, streaming, and atomically mutating
// `EntityRecord`, `SubmissionRecord`, plot locks, media attachments, impact
// events, and audit logs.
//
// Follows `docs/technical/sync-engine.md`:
//   - Outbox drain via `MutateData` and `RecordImpactEvents`, which assign
//     authoritative monotonic server `commit_timestamp` values.
//   - Delta sync streams (`StreamEntities`, `StreamSubmissions`,
//     `StreamImpactEvents`, `StreamAuditRecords`) filtered by
//     `commit_timestamp > since_timestamp` and ordered by
//     `commit_timestamp ASC`. They close when caught up; clients poll them
//     while in the foreground.
//   - Query RPCs (`ListEntities`, `ListSubmissions`, `ListEntityClusters`,
//     `GetImpactAggregates`) for server-side filtering, sorting, paging, and
//     aggregation that clients can't do from a local copy (e.g., Web Console
//     data tables over large surveys).
service DataService {
  // Retrieves a single entity record by ID.
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);

  // Queries entity records for a survey with server-side filtering, sorting,
  // and paging. Pass `ListEntitiesResponse.server_watermark` as
  // `since_timestamp` when polling `StreamEntities` to receive changes made
  // after the query.
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);

  // Delta sync. Streams `EntityRecord` items where `commit_timestamp >
  // since_timestamp` (and `<= until_timestamp` when set) in strict
  // `commit_timestamp ASC` order, including soft-deleted tombstones
  // (`is_deleted == true`). Closes when caught up.
  rpc StreamEntities(StreamEntitiesRequest) returns (stream EntityRecord);

  // Returns S2 cell spatial clusters for fast Web Console map rendering at
  // overview zoom levels.
  rpc ListEntityClusters(ListEntityClustersRequest) returns (ListEntityClustersResponse);

  // Retrieves a single submission record by ID.
  rpc GetSubmission(GetSubmissionRequest) returns (GetSubmissionResponse);

  // Queries submission records for a survey with server-side filtering,
  // sorting, and paging. Pass `ListSubmissionsResponse.server_watermark` as
  // `since_timestamp` when polling `StreamSubmissions` to receive changes
  // made after the query.
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse);

  // Delta sync. Streams `SubmissionRecord` items where `commit_timestamp >
  // since_timestamp` in strict `commit_timestamp ASC` order. Closes when
  // caught up.
  rpc StreamSubmissions(StreamSubmissionsRequest) returns (stream SubmissionRecord);

  // Atomically and idempotently executes an ordered sequence of entity and
  // submission mutations (`update` and hard `delete`), returning the assigned
  // server `commit_timestamp`.
  rpc MutateData(MutateDataRequest) returns (MutateDataResponse);

  // Acquires or renews a 5-minute collaborative plot lock for CEO desk
  // interpretation.
  rpc AcquirePlotLock(AcquirePlotLockRequest) returns (AcquirePlotLockResponse);

  // Releases an active collaborative plot lock.
  rpc ReleasePlotLock(ReleasePlotLockRequest) returns (ReleasePlotLockResponse);

  // Prepares a content-addressed (`sha256_hash`) signed upload URL for binary
  // media attachments.
  rpc PrepareMediaUpload(PrepareMediaUploadRequest) returns (PrepareMediaUploadResponse);

  // Resolves a signed download URL for a media attachment.
  rpc GetMediaDownloadUrl(GetMediaDownloadUrlRequest) returns (GetMediaDownloadUrlResponse);

  // Records a batch of idempotent client-generated `ImpactEvent` signals.
  rpc RecordImpactEvents(RecordImpactEventsRequest) returns (RecordImpactEventsResponse);

  // Delta sync for `ImpactEvent` records ordered by `commit_timestamp ASC`.
  rpc StreamImpactEvents(StreamImpactEventsRequest) returns (stream ImpactEvent);

  // Retrieves pre-aggregated impact metrics (`ImpactAggregate`).
  rpc GetImpactAggregates(GetImpactAggregatesRequest) returns (GetImpactAggregatesResponse);

  // Delta sync for `AuditRecord` entries ordered by `commit_timestamp ASC`.
  rpc StreamAuditRecords(StreamAuditRecordsRequest) returns (stream AuditRecord);

  // Lists searchable geographic places and landmarks for map place search.
  rpc ListPlaces(ListPlacesRequest) returns (ListPlacesResponse);

  // Lists mutation log items tracked for the unified Uploads queue.
  rpc ListMutationLogs(ListMutationLogsRequest) returns (ListMutationLogsResponse);
}

// Smart queue filter mode for CEO desk interpretation.
enum QueueFilterMode {
  QUEUE_FILTER_MODE_UNSPECIFIED = 0;
  QUEUE_FILTER_MODE_ALL = 1;
  QUEUE_FILTER_MODE_UNANALYZED = 2;
  QUEUE_FILTER_MODE_ANALYZED_BY_ME = 3;
  QUEUE_FILTER_MODE_FLAGGED = 4;
  QUEUE_FILTER_MODE_LOW_CONFIDENCE = 5;
  QUEUE_FILTER_MODE_HIGH_DISAGREEMENT = 6;
  QUEUE_FILTER_MODE_HAS_CONFLICT = 7;
}

// =============================================================================
// Read & Stream Messages (Entities & Submissions)
// =============================================================================

message GetEntityRequest {
  string survey_id = 1;
  string dataset_id = 2;
  string entity_id = 3;
}

message GetEntityResponse {
  EntityRecord entity = 1;
}

message ListEntitiesRequest {
  string survey_id = 1;
  string dataset_id = 2;
  int32 page_size = 3;
  string page_token = 4;
  bool include_deleted = 5;
  GeoBoundingBox bbox = 6;
  map<string, string> filter = 7;
  repeated string field_mask = 8;

  reserved 9, 10;
  reserved "since_timestamp", "until_timestamp";

  // Optional S2 cell token prefixes for selective spatial sync.
  repeated string s2_cell_tokens = 11;

  // Optional CEO smart queue filter mode.
  QueueFilterMode queue_filter_mode = 12;

  // Optional sort order, e.g. `"label"` or `"commit_timestamp desc"`.
  string order_by = 13;
}

message GeoBoundingBox {
  double min_latitude = 1;
  double min_longitude = 2;
  double max_latitude = 3;
  double max_longitude = 4;
}

message ListEntitiesResponse {
  repeated EntityRecord entities = 1;
  string next_page_token = 2;

  // Server time the query ran at; use as `since_timestamp` for live updates.
  google.protobuf.Timestamp server_watermark = 3;
}

message StreamEntitiesRequest {
  string survey_id = 1;
  string dataset_id = 2;
  google.protobuf.Timestamp since_timestamp = 3;
  google.protobuf.Timestamp until_timestamp = 4;
  bool include_deleted = 5;
  repeated string s2_cell_tokens = 6;
}

message EntityCluster {
  string s2_cell_token = 1;
  groundplatform.v2.forms.GeoPoint centroid = 2;
  int32 total_count = 3;
  int32 completed_count = 4;
  int32 in_progress_count = 5;
  int32 pending_count = 6;
}

message ListEntityClustersRequest {
  string survey_id = 1;
  string dataset_id = 2;
  GeoBoundingBox bbox = 3;
  int32 s2_level = 4;
}

message ListEntityClustersResponse {
  repeated EntityCluster clusters = 1;
}

message GetSubmissionRequest {
  string survey_id = 1;
  string submission_id = 2;
}

message GetSubmissionResponse {
  SubmissionRecord submission = 1;
}

message ListSubmissionsRequest {
  string survey_id = 1;
  string form_id = 2;
  string entity_id = 3;
  int32 page_size = 4;
  string page_token = 5;
  bool include_deleted = 6;

  reserved 7, 8;
  reserved "since_timestamp", "until_timestamp";

  // Optional field filters (e.g., `"collector_email"`, `"review_status"`).
  map<string, string> filter = 9;

  // Optional sort order, e.g. `"collector_name"` or `"commit_timestamp desc"`.
  string order_by = 10;
}

message ListSubmissionsResponse {
  repeated SubmissionRecord submissions = 1;
  string next_page_token = 2;

  // Server time the query ran at; use as `since_timestamp` for live updates.
  google.protobuf.Timestamp server_watermark = 3;
}

message StreamSubmissionsRequest {
  string survey_id = 1;
  string form_id = 2;
  string entity_id = 3;
  google.protobuf.Timestamp since_timestamp = 4;
  google.protobuf.Timestamp until_timestamp = 5;
  bool include_deleted = 6;
}

// =============================================================================
// Batched Idempotent Mutation Messages (MutateData)
// =============================================================================

message EntityFieldPatch {
  string key = 1;

  oneof value {
    google.protobuf.NullValue null_value = 2;
    groundplatform.v2.forms.TypedValue property_value = 3;
    string label_value = 4;
    bool bool_value = 5;
    groundplatform.v2.forms.GeoPoint point_value = 6;
    groundplatform.v2.forms.GeoTrace trace_value = 7;
    groundplatform.v2.forms.GeoShape shape_value = 8;
  }
}

message EntityPatch {
  repeated EntityFieldPatch patches = 1;
}

message EntityMutation {
  string dataset_id = 1;
  string entity_id = 2;
  int64 base_revision = 3;

  oneof operation {
    EntityPatch update = 4;
    bool delete = 5;
    EntityRecord upsert = 6;
  }
}

message SubmissionFieldPatch {
  string key = 1;

  oneof value {
    google.protobuf.NullValue null_value = 2;
    groundplatform.v2.forms.FieldValue field_value = 3;
    bool bool_value = 4;
    string string_value = 5;
    groundplatform.v2.forms.RecordMetadata metadata_value = 6;
    groundplatform.v2.forms.AuditLog audit_log_value = 7;
    bytes bytes_value = 8;
    groundplatform.v2.forms.EncryptedSubmissionManifest encrypted_manifest_value = 9;
    ReviewStatus review_status_value = 10;
  }
}

message SubmissionPatch {
  repeated SubmissionFieldPatch patches = 1;
}

message SubmissionMutation {
  string submission_id = 1;
  string form_id = 2;
  int64 base_revision = 3;

  oneof operation {
    SubmissionPatch update = 4;
    bool delete = 5;
    SubmissionRecord upsert = 6;
  }
}

message DataMutation {
  oneof target {
    EntityMutation entity_mutation = 1;
    SubmissionMutation submission_mutation = 2;
  }

  // Client-generated idempotency UUID (`MutationLogItem.id`) from the offline
  // outbox.
  string mutation_id = 3;

  // Client-side timestamp when the mutation was recorded offline.
  google.protobuf.Timestamp client_timestamp = 4;
}

message MutateDataRequest {
  string survey_id = 1;
  repeated DataMutation mutations = 2;
}

enum ConflictResolutionStatus {
  CONFLICT_RESOLUTION_STATUS_UNSPECIFIED = 0;
  CONFLICT_RESOLUTION_STATUS_CLEAN = 1;
  CONFLICT_RESOLUTION_STATUS_AUTO_MERGED = 2;
  CONFLICT_RESOLUTION_STATUS_CONFLICT_RECORDED = 3;
}

message DataMutationResult {
  oneof result {
    EntityRecord entity = 1;
    SubmissionRecord submission = 2;
    string deleted_id = 3;
  }

  ConflictResolutionStatus conflict_status = 4;
  google.protobuf.Timestamp commit_timestamp = 5;
}

message MutateDataResponse {
  repeated DataMutationResult results = 1;
  google.protobuf.Timestamp commit_timestamp = 2;
}

// =============================================================================
// Collaborative Plot Locking, Media, Impact, Audit & Places Messages
// =============================================================================

message AcquirePlotLockRequest {
  string survey_id = 1;
  string dataset_id = 2;
  string entity_id = 3;
  string user_id = 4;
  QueueFilterMode queue_filter_mode = 5;
}

message AcquirePlotLockResponse {
  EntityRecord entity = 1;
  PlotLock lock = 2;
}

message ReleasePlotLockRequest {
  string survey_id = 1;
  string dataset_id = 2;
  string entity_id = 3;
  string user_id = 4;
}

message ReleasePlotLockResponse {
  bool released = 1;
}

message PrepareMediaUploadRequest {
  string survey_id = 1;
  string submission_id = 2;
  string sha256_hash = 3;
  string mime_type = 4;
  int64 byte_size = 5;
}

message PrepareMediaUploadResponse {
  string upload_url = 1;
  string media_uri = 2;
  bool already_exists = 3;
}

message GetMediaDownloadUrlRequest {
  string survey_id = 1;
  string media_uri = 2;
}

message GetMediaDownloadUrlResponse {
  string download_url = 1;
}

message RecordImpactEventsRequest {
  repeated ImpactEvent events = 1;
}

message RecordImpactEventsResponse {
  repeated ImpactEvent events = 1;
  google.protobuf.Timestamp commit_timestamp = 2;
}

message StreamImpactEventsRequest {
  string survey_id = 1;
  string organization_id = 2;
  google.protobuf.Timestamp since_timestamp = 3;
  google.protobuf.Timestamp until_timestamp = 4;
}

message GetImpactAggregatesRequest {
  string organization_id = 1;
  string survey_id = 2;
}

message GetImpactAggregatesResponse {
  repeated ImpactAggregate aggregates = 1;
}

message StreamAuditRecordsRequest {
  string survey_id = 1;
  string target_id = 2;
  google.protobuf.Timestamp since_timestamp = 3;
  google.protobuf.Timestamp until_timestamp = 4;
}

// Geographic place or landmark returned by the backend place catalog.
message PlaceRecord {
  string id = 1;
  string name = 2;
  string category_label = 3;
  string region_subtitle = 4;
  string coordinates_label = 5;
  float normalized_x = 6;
  float normalized_y = 7;
  float zoom_delta = 8;
  double longitude = 9;
  double latitude = 10;
  optional double bbox_min_lng = 11;
  optional double bbox_min_lat = 12;
  optional double bbox_max_lng = 13;
  optional double bbox_max_lat = 14;
  float target_zoom = 15;
  string mapbox_place_id = 16;
  string source_label = 17;
}

message ListPlacesRequest {
  string survey_id = 1;
  string query = 2;
}

message ListPlacesResponse {
  repeated PlaceRecord places = 1;
}

// Mutation log entry for seeding and inspecting the unified Uploads queue.
message MutationLogRecord {
  string id = 1;
  string survey_id = 2;
  string operation_kind_key = 3;
  string title = 4;
  string target_label = 5;
  string entity_id = 6;
  optional string submission_id = 7;
  string actor_name = 8;
  string state_key = 9;
  string state_detail = 10;
  string operation_timestamp = 11;
  optional string started_timestamp = 12;
  optional string completed_timestamp = 13;
  string payload_summary = 14;
  google.protobuf.Timestamp commit_timestamp = 15;
}

message ListMutationLogsRequest {
  string survey_id = 1;
  google.protobuf.Timestamp since_timestamp = 2;
}

message ListMutationLogsResponse {
  repeated MutationLogRecord mutation_logs = 1;
  google.protobuf.Timestamp server_watermark = 2;
}
