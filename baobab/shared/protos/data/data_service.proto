syntax = "proto3";

package groundplatform.v2.data;

import "google/protobuf/struct.proto";
import "shared/protos/data/entity_record.proto";
import "shared/protos/data/submission_record.proto";
import "shared/protos/forms/audit_log.proto";
import "shared/protos/forms/encrypted_submission.proto";
import "shared/protos/forms/record_instance.proto";
import "shared/protos/forms/types.proto";

// Core gRPC service for reading and atomically mutating `EntityRecord` and
// `SubmissionRecord` data.
//
// Because `entity_id` and `submission_id` are RFC 4122 v4 UUIDs generated by
// the client prior to synchronization, `create` and `update` operations are
// merged into a single idempotent `update` mutation (`EntityMutation.update`
// and `SubmissionMutation.update`). Applying an `update` to a UUID that does
// not yet exist initializes the record with that client-defined UUID and
// applies the key-value field updates; re-applying the same `update` batch on
// network retry converges to the exact same state without duplicating records.
//
// All write operations (`update`—including setting `is_deleted = true` for soft
// deletes and `NullValue` for property/field removal—and permanent hard
// `delete`) are unified into the batched `MutateData` RPC so interdependent
// mutations (such as initializing a new `EntityRecord` and immediately
// recording a `SubmissionRecord` that references its `entity_id`) commit in a
// single atomic transaction.
service DataService {
  // Retrieves a single entity record by ID.
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);

  // Lists entity records for a survey (optionally filtered by dataset ID).
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);

  // Retrieves a single submission record by ID.
  rpc GetSubmission(GetSubmissionRequest) returns (GetSubmissionResponse);

  // Lists submission records for a survey (optionally filtered by form ID or
  // linked entity ID).
  rpc ListSubmissions(ListSubmissionsRequest) returns (ListSubmissionsResponse);

  // Atomically and idempotently executes an ordered sequence of entity and
  // submission mutations (`update` and hard `delete`).
  rpc MutateData(MutateDataRequest) returns (MutateDataResponse);
}

// =============================================================================
// Read Messages (Get / List)
// =============================================================================

// Request to fetch a single entity record.
message GetEntityRequest {
  // Survey identifier (`SurveyDef.survey_id`).
  string survey_id = 1;

  // Dataset identifier (`EntityDatasetDef.id`).
  string dataset_id = 2;

  // Unique entity UUID (`EntityRecord.entity_id`).
  string entity_id = 3;
}

// Response containing the requested entity record.
message GetEntityResponse {
  // Retrieved entity record.
  EntityRecord entity = 1;
}

// Request to list entities in a survey for offline dataset sync or management.
message ListEntitiesRequest {
  // Survey identifier (`SurveyDef.survey_id`).
  string survey_id = 1;

  // Optional dataset identifier filter (`EntityDatasetDef.id`). If empty,
  // returns entities across all datasets in the survey.
  string dataset_id = 2;

  // Maximum number of entities to return per page.
  int32 page_size = 3;

  // Pagination cursor token from a previous `ListEntitiesResponse`.
  string page_token = 4;

  // Whether to include soft-deleted entities (`is_deleted == true`).
  bool include_deleted = 5;
}

// Response containing matching entity records.
message ListEntitiesResponse {
  // Entity records matching the request.
  repeated EntityRecord entities = 1;

  // Token for retrieving the next page of results, or empty if none remain.
  string next_page_token = 2;
}

// Request to fetch a single submission record.
message GetSubmissionRequest {
  // Survey identifier (`SurveyDef.survey_id`).
  string survey_id = 1;

  // Unique submission UUID (`SubmissionRecord.submission_id`).
  string submission_id = 2;
}

// Response containing the requested submission record.
message GetSubmissionResponse {
  // Retrieved submission record.
  SubmissionRecord submission = 1;
}

// Request to list submissions in a survey.
message ListSubmissionsRequest {
  // Survey identifier (`SurveyDef.survey_id`).
  string survey_id = 1;

  // Optional form identifier filter (`FormDef.form_id`).
  string form_id = 2;

  // Optional linked entity identifier filter (`EntityRecord.entity_id`).
  string entity_id = 3;

  // Maximum number of submissions to return per page.
  int32 page_size = 4;

  // Pagination cursor token from a previous `ListSubmissionsResponse`.
  string page_token = 5;

  // Whether to include soft-deleted submissions (`is_deleted == true`).
  bool include_deleted = 6;
}

// Response containing matching submission records.
message ListSubmissionsResponse {
  // Submission records matching the request.
  repeated SubmissionRecord submissions = 1;

  // Token for retrieving the next page of results, or empty if none remain.
  string next_page_token = 2;
}

// =============================================================================
// Batched Idempotent Mutation Messages (MutateData)
// =============================================================================

// Key-value mutation entry for initializing or partially updating an
// `EntityRecord`.
//
// `key` identifies an attribute key in `EntityRecord.properties` or a reserved
// system property (`"label"`, `"geometry"`, `"is_field_created"`,
// `"is_deleted"`). Setting `null_value` removes the attribute from `properties`
// or clears the targeted field. Soft deletion is performed by updating
// `key = "is_deleted"` with `bool_value = true`.
message EntityFieldPatch {
  // Property key in `EntityRecord.properties` or reserved field name
  // (`"label"`, `"geometry"`, `"is_field_created"`, `"is_deleted"`).
  string key = 1;

  // Value to assign, or `null_value` to delete the property/field.
  oneof value {
    // Deletes the property `key` from `EntityRecord.properties` (or clears
    // `"label"` / `"geometry"`; idempotent no-op if already absent).
    google.protobuf.NullValue null_value = 2;

    // Typed attribute value to set in `EntityRecord.properties[key]`.
    groundplatform.v2.forms.TypedValue property_value = 3;

    // Sets `EntityRecord.label` (when `key == "label"`).
    string label_value = 4;

    // Sets boolean system fields such as `EntityRecord.is_field_created`
    // (`key == "is_field_created"`) or `EntityRecord.is_deleted` for
    // soft-delete / restoration (`key == "is_deleted"`).
    bool bool_value = 5;

    // Sets `EntityRecord.point` geometry (when `key == "geometry"`).
    groundplatform.v2.forms.GeoPoint point_value = 6;

    // Sets `EntityRecord.trace` geometry (when `key == "geometry"`).
    groundplatform.v2.forms.GeoTrace trace_value = 7;

    // Sets `EntityRecord.shape` geometry (when `key == "geometry"`).
    groundplatform.v2.forms.GeoShape shape_value = 8;
  }
}

// Collection of key-value field mutations applied to create or update an
// `EntityRecord`.
message EntityPatch {
  // Ordered list of key-value field/property mutations.
  repeated EntityFieldPatch patches = 1;
}

// Idempotent mutation targeting a single `EntityRecord` (`update` or permanent
// hard `delete`).
//
// Because `entity_id` is a client-defined UUID, `update` handles both entity
// creation and subsequent updates: if no entity with `entity_id` exists in
// `dataset_id`, a new `EntityRecord` is initialized with `entity_id` and
// `dataset_id` before applying the `EntityFieldPatch` entries.
message EntityMutation {
  // Dataset identifier (`EntityDatasetDef.id`).
  string dataset_id = 1;

  // Client-defined entity UUID (`EntityRecord.entity_id`, RFC 4122 v4).
  string entity_id = 2;

  // Expected base revision number for optimistic concurrency control on
  // existing entities (optional).
  int64 base_revision = 3;

  // Concrete mutation operation to perform on the entity.
  oneof operation {
    // Initializes (if `entity_id` does not yet exist) or updates the entity by
    // applying key-value mutations (using `null_value` for property deletion,
    // or `key = "is_deleted"` -> `bool_value = true` for soft deletion).
    EntityPatch update = 4;

    // When true, permanently hard-deletes and purges the entity record from
    // storage (idempotent if already deleted).
    bool delete = 5;
  }
}

// Key-value mutation entry for initializing or partially updating a
// `SubmissionRecord`.
//
// `key` identifies a field name or slash-delimited field path within
// `RecordInstance.data`, or a reserved system key (`"form_id"`,
// `"form_version"`, `"entity_id"`, `"metadata"`, `"audit_log"`,
// `"raw_payload"`, `"encrypted_manifest"`, `"is_deleted"`). Setting
// `null_value` removes the field answer from the record node or clears the
// targeted system field. Soft deletion is performed by updating
// `key = "is_deleted"` with `bool_value = true`.
message SubmissionFieldPatch {
  // Field key or path within `SubmissionRecord.record.data` (e.g.,
  // `"species"`, `"plot_details/canopy_cover"`), or reserved system key
  // (`"form_id"`, `"form_version"`, `"entity_id"`, `"metadata"`,
  // `"audit_log"`, `"raw_payload"`, `"encrypted_manifest"`, `"is_deleted"`).
  string key = 1;

  // New field value to set, or `null_value` to delete the field answer.
  oneof value {
    // Deletes the field entry identified by `key` (idempotent no-op if already
    // absent).
    google.protobuf.NullValue null_value = 2;

    // Sets or replaces the `FieldValue` (scalar, list, group node, or repeat
    // list) at `key` in `SubmissionRecord.record.data`.
    groundplatform.v2.forms.FieldValue field_value = 3;

    // Sets boolean system fields such as `SubmissionRecord.is_deleted` for
    // soft-delete or restoration (when `key == "is_deleted"`).
    bool bool_value = 4;

    // Sets string system fields such as `SubmissionRecord.form_id`
    // (`key == "form_id"`), `SubmissionRecord.form_version`
    // (`key == "form_version"`), or `SubmissionRecord.entity_id`
    // (`key == "entity_id"`).
    string string_value = 5;

    // Sets `SubmissionRecord.metadata` (when `key == "metadata"`).
    groundplatform.v2.forms.RecordMetadata metadata_value = 6;

    // Sets `SubmissionRecord.record.audit_log` (when `key == "audit_log"`).
    groundplatform.v2.forms.AuditLog audit_log_value = 7;

    // Sets `SubmissionRecord.raw_payload` (when `key == "raw_payload"`).
    bytes bytes_value = 8;

    // Sets `SubmissionRecord.encrypted_manifest` (when
    // `key == "encrypted_manifest"`).
    groundplatform.v2.forms.EncryptedSubmissionManifest
        encrypted_manifest_value = 9;
  }
}

// Collection of key-value field mutations applied to create or update a
// `SubmissionRecord`.
message SubmissionPatch {
  // Ordered list of key-value field mutations.
  repeated SubmissionFieldPatch patches = 1;
}

// Idempotent mutation targeting a single `SubmissionRecord` (`update` or
// permanent hard `delete`).
//
// Because `submission_id` is a client-defined UUID, `update` handles both
// initial submission creation and subsequent field edits: if no submission with
// `submission_id` exists yet, a new `SubmissionRecord` is initialized with the
// client-supplied `submission_id` (and optional `form_id` / `form_version`)
// before applying the `SubmissionFieldPatch` entries.
message SubmissionMutation {
  // Client-defined submission UUID (`SubmissionRecord.submission_id`,
  // RFC 4122 v4).
  string submission_id = 1;

  // Target form identifier (`FormDef.form_id`; required when initializing a new
  // submission unless supplied via `SubmissionFieldPatch` with
  // `key = "form_id"`).
  string form_id = 2;

  // Expected base revision number for optimistic concurrency control on
  // existing submissions (optional).
  int64 base_revision = 3;

  // Concrete mutation operation to perform on the submission.
  oneof operation {
    // Initializes (if `submission_id` does not yet exist) or updates the
    // submission by applying key-value field mutations (using `null_value` for
    // field deletion, or `key = "is_deleted"` -> `bool_value = true` for soft
    // deletion).
    SubmissionPatch update = 4;

    // When true, permanently hard-deletes and purges the submission record from
    // storage (idempotent if already deleted).
    bool delete = 5;
  }
}

// A single idempotent mutation item in a `MutateDataRequest` batch.
message DataMutation {
  oneof target {
    // Mutation applied to an `EntityRecord`.
    EntityMutation entity_mutation = 1;

    // Mutation applied to a `SubmissionRecord`.
    SubmissionMutation submission_mutation = 2;
  }
}

// Request to atomically and idempotently execute an ordered batch of entity and
// submission mutations within a survey.
//
// Mutations are processed in order within a single transaction so that newly
// initialized entities in the batch (`EntityMutation.update`) can be
// immediately referenced by subsequent submission (`SubmissionMutation.update`)
// or entity mutations in the same request.
message MutateDataRequest {
  // Survey identifier (`SurveyDef.survey_id`).
  string survey_id = 1;

  // Ordered sequence of idempotent entity and submission mutations to apply
  // atomically.
  repeated DataMutation mutations = 2;
}

// Outcome of an individual `DataMutation` within a `MutateDataResponse`.
message DataMutationResult {
  oneof result {
    // Initialized or updated entity record (unset if hard-deleted via
    // `delete`).
    EntityRecord entity = 1;

    // Initialized or updated submission record (unset if hard-deleted via
    // `delete`).
    SubmissionRecord submission = 2;

    // Target record ID when permanently purged via a hard `delete` mutation.
    string deleted_id = 3;
  }
}

// Response returning the results of all mutations in the `MutateDataRequest`
// batch, in corresponding order.
message MutateDataResponse {
  // Results corresponding 1:1 with `MutateDataRequest.mutations`.
  repeated DataMutationResult results = 1;
}
