syntax = "proto3";

package groundplatform.v2.data;

import "shared/protos/survey/acl.proto";
import "google/protobuf/timestamp.proto";

// Audit metadata recording creation and modification details for a resource.
message AuditInfo {
  // Unique user ID (e.g., Firebase Auth UID) of the user who created this
  // resource.
  string created_by = 1;

  // Timestamp when this resource was originally created.
  google.protobuf.Timestamp create_time = 2;

  // Unique user ID (e.g., Firebase Auth UID) of the user who last modified
  // this resource.
  string last_modified_by = 3;

  // Timestamp when this resource was last modified.
  google.protobuf.Timestamp last_modify_time = 4;
}

// Before and after snapshot values for an audited attribute delta.
message FieldDelta {
  // String representation of the value prior to modification.
  string old_value = 1;

  // String representation of the value following modification.
  string new_value = 2;
}

// Platform-wide append-only audit trail entry capturing mutations and
// administrative actions.
message AuditRecord {
  // Globally unique audit record UUID.
  string audit_id = 1;

  // Survey identifier where the mutation occurred.
  string survey_id = 2;

  // Category of the affected target resource (e.g., "SURVEY", "FORM", "ENTITY",
  // "SUBMISSION").
  string target_type = 3;

  // Unique identifier of the mutated entity, submission, form, or survey.
  string target_id = 4;

  // Precise UTC timestamp of the mutation.
  google.protobuf.Timestamp timestamp = 5;

  // Unique user ID (e.g., Firebase Auth UID) of the actor performing the
  // action.
  string actor_id = 6;

  // Role of the actor at the time of the change.
  groundplatform.v2.survey.Role actor_role = 7;

  // Specific mutation action type.
  enum AuditAction {
    AUDIT_ACTION_UNSPECIFIED = 0;
    CREATE = 1;
    UPDATE = 2;
    SOFT_DELETE = 3;
    RESTORE = 4;
    PUBLISH = 5;
  }
  AuditAction action = 8;

  // Before-and-after deltas for modified attributes, serialized as key ->
  // delta.
  map<string, FieldDelta> field_deltas = 9;

  // Client platform where the edit originated ("WEB_CONSOLE", "ANDROID",
  // "IOS").
  string client_platform = 10;

  // Client application software version string.
  string client_version = 11;
}
