syntax = "proto3";

package groundplatform.v2.data;

import "google/protobuf/timestamp.proto";

// One "data was used" signal for impact measurement (an export, a partner
// push, a receipt, a DOI, or a survey closing). Append-only and aggregate
// only: events carry counts and areas, never geometry or personal data
// beyond the acting user's ID. See
// docs/technical/model/data/04-impact-events.md.
message ImpactEvent {
  // Unique ID of this event, generated by the client that recorded it so
  // offline events can be uploaded idempotently.
  string event_id = 1;

  ImpactEventType type = 2;

  // Survey the data comes from.
  string survey_id = 3;

  // Organization the survey belongs to, or empty for a personal survey.
  string organization_id = 4;

  // The survey's Purpose Packs when the event happened (`SurveyDef.purpose_ids`).
  repeated string purpose_ids = 5;

  // Export profile used (`ExportProfileDef.id`), for EXPORT events that used
  // one; empty for plain exports.
  optional string export_profile_id = 6;

  // Map features (or records) covered, counting plots that share a GeoID once.
  int64 feature_count = 7;

  // Total area of the covered features in hectares, counting plots that share
  // a GeoID once.
  double area_ha = 8;

  google.protobuf.Timestamp occurred_at = 9;

  // User ID (e.g., Firebase Auth UID) of the person whose action produced the
  // event. The only personal identifier an event may carry.
  string actor_user_id = 10;
}

// Kind of "data was used" signal.
enum ImpactEventType {
  // Unspecified event type.
  IMPACT_EVENT_TYPE_UNSPECIFIED = 0;

  // Data downloaded from the web console (CSV, GeoJSON, or an export profile
  // such as EUDR GeoJSON).
  EXPORT = 1;

  // Data sent to a partner system (e.g., FERM, Whisp, a national registry).
  PARTNER_PUSH = 2;

  // A PDF receipt or report generated for a map feature or submission.
  RECEIPT_GENERATED = 3;

  // A generated receipt shared or downloaded.
  RECEIPT_SHARED = 4;

  // A DOI minted for an open dataset (e.g., on Zenodo).
  DOI_MINTED = 5;

  // The survey moved from PUBLISHED to CLOSED or ARCHIVED.
  SURVEY_CLOSED = 6;
}
