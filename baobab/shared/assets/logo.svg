<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!--
    Ground 2.0 3-Tone World Lens Badge App Icon (Variant 1C-4 — "Windswept Savanna & Tapered-Wingtip Base")
    - Tone 1 (Deep Woodland Primary): #153B1E
    - Tone 2 (InversePrimary Soft Sage Sky): #9CD49F
    - Tone 3 (Soft Savanna Sun-Amber): #FFE082
  -->
  <defs>
    <clipPath id="ground-1c4-above-ground" clipPathUnits="userSpaceOnUse">
      <path d="M0 0 L512 0 L512 436 C340 398, 172 402, 0 444 Z" />
    </clipPath>
    <clipPath id="ground-1c4-lens-clip" clipPathUnits="userSpaceOnUse">
      <circle cx="256" cy="256" r="216" />
    </clipPath>
  </defs>

  <g clip-path="url(#ground-1c4-above-ground)">
    <!-- 1. Tone 1 (#153B1E): Outer World Lens Ring (cx=256, cy=256, r=236, 20px border around r=216 lens) -->
    <path
      d="M103.37 436 A236 236 0 1 1 408.63 436 Z"
      fill="#153B1E"
    />

    <g clip-path="url(#ground-1c4-lens-clip)">
