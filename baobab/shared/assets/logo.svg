      <path
        d="M128.02 430 A216 216 0 1 1 383.98 430 Z"
        fill="#9CD49F"
      />

      <!-- 3. Tone 3 (#FFE082): Soft Savanna Sun-Amber Disc (cx=256, cy=288, r=142) -->
      <circle cx="256" cy="288" r="142" fill="#FFE082" />

