<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <clipPath id="gm-pin-clip">
      <path d="M256 64 C160 64, 94 134, 94 224 C94 318, 204 392, 243 422 C250 428, 262 428, 269 422 C308 392, 418 318, 418 224 C418 134, 352 64, 256 64 Z" />
    </clipPath>
  </defs>

  <!-- 1. Solid Deep Forest Pebble Container -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="#0F3828" />

  <!-- 2. Solid Crisp Mint-Emerald Droplet Sky -->
  <path
    d="M256 64 C160 64, 94 134, 94 224 C94 318, 204 392, 243 422 C250 428, 262 428, 269 422 C308 392, 418 318, 418 224 C418 134, 352 64, 256 64 Z"
    fill="#52D69A"
  />

  <!-- Clipped Savanna Landscape Inside the Droplet -->
  <g clip-path="url(#gm-pin-clip)">
    <!-- 3. Solid Radiant Gold Sunrise Disc -->
    <circle cx="256" cy="244" r="104" fill="#FDE047" />

    <!-- 4. Solid Ultra-Deep Pine Cloud Acacia Canopy (3 Golden-Ratio Lobes) -->
    <path
      d="M164 182
         C162 158, 190 146, 218 154
         C234 134, 278 132, 298 152
         C332 142, 374 156, 376 182
         C378 200, 348 204, 308 198
         C274 192, 238 192, 204 196
         C178 198, 165 194, 164 182 Z"
      fill="#071F16"
    />

    <!-- Lower-Left Cloud Bough (22px Clear Sky Channel for Small-Size Legibility) -->
    <path
      d="M118 230
         C116 210, 142 200, 170 208
         C190 202, 216 210, 218 226
         C220 238, 196 242, 166 240
         C138 242, 119 238, 118 230 Z"
      fill="#071F16"
    />

    <!-- Calligraphic Trunk with Grounded Root Flare & Open Branch Window -->
    <path
      d="M200 354
         C228 324, 241 288, 243 252
         C243 238, 215 232, 180 230
         L202 218
         C226 220, 243 228, 249 242
         L249 186
         L267 186
         C267 210, 268 232, 269 252
         C271 288, 284 324, 312 354
         Z"
      fill="#071F16"
    />

    <!-- Low-Horizon Rolling Earth Mound -->
    <path d="M94 344 C190 312, 322 312, 418 344 L256 440 Z" fill="#071F16" />
  </g>

  <!-- 5. Solid Persimmon-Orange Geopoint Circle at Zenith -->
  <circle cx="256" cy="114" r="24" fill="#F97316" />

  <!-- Bold Rounded Concentric Horizon Arc -->
  <path
    d="M142 440 C200 412, 312 412, 370 440"
    stroke="#52D69A"
    stroke-width="16"
    stroke-linecap="round"
  />
</svg>
